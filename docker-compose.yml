services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # 8080 = หน้าบ้าน HTTP (MikroTik 8008 -> 8080), 8443 = ทั้งระบบ HTTPS (MikroTik 8010 -> 8443)
    # ไม่ใช้ 80/443 เพราะ IP สาธารณะใช้ 2 พอร์ตนี้กับเว็บ NASLINK แล้ว
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - PUBLIC_IP=${PUBLIC_IP:-125.26.22.145}
      - LAN_IP=${LAN_IP:-192.168.200.196}
      - ADMIN_PUBLIC_PORT=${ADMIN_PUBLIC_PORT:-8010}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    build: .
    restart: unless-stopped
    # --proxy-headers: ให้เห็น IP จริงของผู้ใช้ที่มาผ่าน Caddy (ใช้กับ IP allowlist/Audit log)
    command: sh -c "alembic upgrade head && uvicorn web.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Bangkok}
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
    expose:
      - "8000"

  worker:
    build: .
    restart: unless-stopped
    command: sh -c "alembic upgrade head && python -m worker.main"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Bangkok}
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro

volumes:
  caddy_data:
  caddy_config:
