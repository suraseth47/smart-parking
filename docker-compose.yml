services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    build: .
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn web.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Bangkok}
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
    expose:
      - "8000"

  worker:
    build: .
    restart: unless-stopped
    command: sh -c "alembic upgrade head && python -m worker.main"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Bangkok}
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro

volumes:
  caddy_data:
  caddy_config:
