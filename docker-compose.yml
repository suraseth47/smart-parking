services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # FRONT_PORT = หน้าบ้าน HTTP, ADMIN_PORT = ทั้งระบบ HTTPS (พอร์ตบน Server; ตั้งใน .env)
    # MikroTik ต้อง forward มาที่พอร์ตเดียวกันนี้ / ไม่ใช้ 80,443 เพราะเว็บ NASLINK ใช้อยู่
    ports:
      - "${FRONT_PORT:-8080}:8080"
      - "${ADMIN_PORT:-8443}:8443"
    environment:
      - PUBLIC_IP=${PUBLIC_IP:-125.26.22.145}
      - LAN_IP=${LAN_IP:-192.168.200.196}
      - ADMIN_PUBLIC_PORT=${ADMIN_PUBLIC_PORT:-8010}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    build: .
    restart: unless-stopped
    # --proxy-headers: ให้เห็น IP จริงของผู้ใช้ที่มาผ่าน Caddy (ใช้กับ IP allowlist/Audit log)
    command: sh -c "alembic upgrade head && uvicorn web.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      # ใช้สร้างลิงก์คำเชิญผู้ใช้ (ที่อยู่หลังบ้านจากภายนอก) — ค่าเดียวกับของ caddy
      - PUBLIC_IP=${PUBLIC_IP:-125.26.22.145}
      - ADMIN_PUBLIC_PORT=${ADMIN_PUBLIC_PORT:-8010}
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
    expose:
      - "8000"

  worker:
    build: .
    restart: unless-stopped
    command: sh -c "alembic upgrade head && python -m worker.main"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Bangkok}
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro

volumes:
  caddy_data:
  caddy_config:
