<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1120">
  <title>ที่จอดรถว่าง - Smart Parking</title>
  <link rel="stylesheet" href="/static/css/public.css?v=20261028c">
  <script defer src="/static/js/vendor/alpine.min.js"></script>
</head>
<body>
  <div class="wrap" x-data="publicPage()" x-init="init()">

    <!-- ===================== รายการสถานที่ (มีหลายแห่ง) ===================== -->
    <div x-show="view === 'sites'" x-cloak>
      <header class="header sticky-top">
        <div>
          <div class="subtitle" x-text="t('subtitle')"></div>
          <h1 class="site-name" x-text="t('allSites')"></h1>
        </div>
        <button type="button" class="pill-btn" x-show="show.lang_switch" @click="toggleLang()" x-text="lang === 'th' ? 'EN' : 'ไทย'"></button>
      </header>

      <div class="sites-tools">
        <span class="muted-sm" x-text="t('sitesCount').replace('{n}', sites.length) + ' · ' + t('freeTotal') + ' ' + sites.reduce((n, s) => n + (s.status === 'stale' ? 0 : s.free), 0)"></span>
        <button type="button" class="link-btn-sm" @click="sortByDistance()" x-show="show.nearby_sort && sites.some((s) => s.latitude !== null)"
                x-text="distances ? t('sortedNear') : t('nearMe')"></button>
      </div>
      <div class="muted-sm" x-show="geoError" x-text="geoError" style="margin-bottom:10px;"></div>

      <template x-for="s in sortedSites" :key="s.code">
        <section class="card site-card" :class="'st-' + s.status">
          <button type="button" class="site-main" @click="openSite(s.code)" :aria-label="siteName(s) + ' ' + siteStatusText(s)">
            <div class="site-info">
              <h2 class="zone-title" x-text="siteName(s)"></h2>
              <div class="muted-sm" x-show="s.address" x-text="s.address"></div>
              <div class="muted-sm" x-show="s.opening_hours" x-text="t('openHours') + ' ' + s.opening_hours"></div>
              <div class="muted-sm" x-show="distances && distances[s.code] !== undefined" x-text="distanceText(s)"></div>
            </div>
            <div class="site-count">
              <template x-if="s.status === 'ok' || s.status === 'full'">
                <div>
                  <span class="zone-free" :class="s.free === 0 ? 'c-taken' : 'c-free'" x-text="s.free"></span>
                  <span class="muted-sm" x-text="'/ ' + s.capacity"></span>
                </div>
              </template>
              <span class="site-pill" x-text="siteStatusText(s)"></span>
            </div>
          </button>
          <div class="site-extra" x-show="s.status === 'ok'">
            <span><svg class="icon c-acc" viewBox="0 0 24 24" aria-hidden="true"><use href="#wheelchair"/></svg>
              <span x-text="t('disabled') + ' ' + s.free_disabled"></span></span>
            <span><svg class="icon c-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
              <span x-text="'EV ' + s.free_ev"></span></span>
          </div>
          <div class="site-actions">
            <button type="button" class="primary-btn" @click="openSite(s.code)"><span x-text="t('viewDetail')"></span></button>
            <a class="nav-btn" x-show="show.directions && s.maps_url" :href="s.maps_url" target="_blank" rel="noopener noreferrer">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"/></svg>
              <span x-text="t('navigate')"></span>
            </a>
          </div>
        </section>
      </template>

      <footer class="footer">
        <span x-text="t('footer1')"></span><br>
        <span x-text="t('footer2')"></span>
      </footer>
    </div>

    <!-- ===================== หน้าภาพรวม ===================== -->
    <div x-show="view === 'overview'">
      <header class="header sticky-top">
        <button type="button" class="round-btn" x-show="multiSite" @click="backToSites()" :aria-label="t('backToSites')" style="margin-right:10px;">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <div style="flex:1; min-width:0;">
          <div class="subtitle" x-text="t('subtitle')"></div>
          <h1 class="site-name" x-text="lang === 'th' ? site.name_th : site.name_en">Smart Parking</h1>
        </div>
        <button type="button" class="pill-btn" x-show="show.lang_switch" @click="toggleLang()" x-text="lang === 'th' ? 'EN' : 'ไทย'"></button>
      </header>
      <div class="site-sub" x-show="site.address || site.opening_hours">
        <div class="muted-sm" x-show="site.address" x-text="site.address"></div>
        <div class="muted-sm" x-show="site.opening_hours" x-text="t('openHours') + ' ' + site.opening_hours"></div>
      </div>
      <a class="nav-btn nav-btn-wide" x-show="show.directions && site.maps_url" :href="site.maps_url" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"/></svg>
        <span x-text="t('navigateHere')"></span>
      </a>

      <div class="live-row" x-show="!stale">
        <span class="live-dot"></span>
        <span x-text="t('online') + ' · ' + t('updatedAt') + ' ' + formattedUpdatedAt"></span>
      </div>

      <div class="banner banner-warn" role="status" x-show="stale">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5M12 18h.01"/></svg>
        <div>
          <div class="banner-title" x-text="t('staleTitle')"></div>
          <div class="banner-text" x-text="t('staleText') + ' ' + formattedUpdatedAt"></div>
        </div>
      </div>

      <!-- ลานจอดเต็ม -->
      <section class="card card-full" x-show="isFull">
        <div class="full-icon">
          <svg viewBox="0 0 64 30" width="40" height="19" aria-hidden="true"><use href="#car"/></svg>
        </div>
        <div class="full-title" x-text="t('fullTitle')"></div>
        <div class="full-sub" x-text="t('free') + ' 0 ' + t('of') + ' ' + total.capacity + ' ' + t('slots')"></div>
        <div class="full-text" x-text="t('fullText')"></div>
      </section>

      <!-- วงแหวนสรุปยอด -->
      <section class="card hero" :class="stale ? 'is-stale' : ''" x-show="!isFull">
        <div class="ring">
          <svg viewBox="0 0 200 200" role="img" :aria-label="t('free') + ' ' + total.free + ' ' + t('of') + ' ' + total.capacity">
            <circle cx="100" cy="100" r="84" class="ring-track"/>
            <circle cx="100" cy="100" r="84" class="ring-value" :stroke-dasharray="ringDash" transform="rotate(-90 100 100)"/>
          </svg>
          <div class="ring-center">
            <div class="ring-number" x-text="total.free">0</div>
            <div class="ring-label" x-text="t('freeOf') + ' ' + total.capacity"></div>
          </div>
        </div>
        <div class="stat-grid">
          <div class="stat"><div class="stat-num c-free" x-text="total.free"></div><div class="stat-label" x-text="t('free')"></div></div>
          <div class="stat"><div class="stat-num c-taken" x-text="counts.occupied"></div><div class="stat-label" x-text="t('occupied')"></div></div>
          <div class="stat"><div class="stat-num c-locked" x-text="counts.locked"></div><div class="stat-label" x-text="t('locked')"></div></div>
          <div class="stat"><div class="stat-num c-unknown" x-text="counts.unknown"></div><div class="stat-label" x-text="t('unknown')"></div></div>
        </div>
        <div class="extra-row">
          <span class="extra">
            <svg class="icon c-acc" viewBox="0 0 24 24" aria-hidden="true"><use href="#wheelchair"/></svg>
            <span x-text="t('disabled') + ' ' + t('free') + ' ' + total.free_disabled"></span>
          </span>
          <span class="extra">
            <svg class="icon c-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
            <span x-text="'EV ' + t('free') + ' ' + total.free_ev"></span>
          </span>
        </div>
        <div class="excluded-note" x-show="total.excluded_zones.length > 0">
          <span x-text="t('excludedNote')"></span>: <span x-text="total.excluded_zones.join(', ')"></span>
        </div>
      </section>

      <!-- การ์ดแต่ละโซน -->
      <template x-for="zone in zones" :key="zone.code">
        <section class="card zone-card" :class="(zone.status === 'closed' ? 'card-closed' : '') + (stale && zone.status !== 'closed' ? ' is-stale' : '')">
          <template x-if="zone.status === 'closed'">
            <div class="closed-row">
              <div class="closed-icon"><svg class="icon c-locked" viewBox="0 0 24 24" aria-hidden="true"><use href="#lock"/></svg></div>
              <div>
                <h2 class="zone-title" x-text="zoneName(zone) + ' · ' + t('closed')"></h2>
                <div class="closed-note" x-text="zone.closed_note || t('closedDefault')"></div>
              </div>
            </div>
          </template>

          <template x-if="zone.status !== 'closed'">
            <div class="zone-body">
              <div class="zone-head">
                <h2 class="zone-title" x-text="zoneName(zone)"></h2>
                <div class="zone-count" x-show="zone.free !== null">
                  <span class="full-tag" x-show="zone.free === 0 && !stale" x-text="t('zoneFull')"></span>
                  <span class="zone-free" :class="zone.free === 0 ? 'c-taken' : 'c-free'" x-text="zone.free"></span> / <span x-text="zone.capacity"></span>
                </div>
              </div>
              <div class="zone-status-label" x-show="zone.status === 'partial'" x-text="t('partialData')"></div>
              <div class="zone-status-label" x-show="zone.status === 'no_data'" x-text="t('noData')"></div>
              <div class="strip" aria-hidden="true" x-show="zone.slots && zone.slots.length" :style="'grid-template-columns: repeat(' + (zone.slots || []).length + ', minmax(0, 1fr))'">
                <template x-for="slot in (zone.slots || [])" :key="slot.code">
                  <div class="strip-cell" :class="'s-' + slotKind(slot)"></div>
                </template>
              </div>
              <div class="free-list" x-show="show.free_list && (zone.status === 'ok' || zone.status === 'partial')">
                <span class="free-list-label" x-text="freeCodes(zone).length ? t('availableSlots') : t('noAvailableSlots')"></span>
                <span class="free-list-codes" x-text="freeCodes(zone).map(noBreak).join(', ')"></span>
              </div>
              <button type="button" class="primary-btn" x-show="show.slot_map && zone.slots && zone.slots.length" @click="openMap(zone.code)">
                <span x-text="t('viewMap')"></span>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
              </button>
            </div>
          </template>
        </section>
      </template>

      <!-- ช่วงเวลาที่คนหนาแน่น -->
      <section class="card" x-show="show.peak_chart && peak.points.length > 0">
        <div class="zone-head">
          <h2 class="zone-title" x-text="t('peakTitle')"></h2>
          <span class="muted-sm" x-text="dayName(peak.weekday)"></span>
        </div>
        <div class="bars" role="img" :aria-label="peakAria">
          <template x-for="b in peakBars" :key="b.hour">
            <div class="bar-col">
              <div class="bar" :class="b.cls" :style="'height: ' + b.height + '%'"></div>
            </div>
          </template>
        </div>
        <div class="bar-labels">
          <template x-for="b in peakBars" :key="'l' + b.hour">
            <span x-text="b.hour % 3 === 0 ? String(b.hour).padStart(2, '0') : ''"></span>
          </template>
        </div>
        <div class="muted-sm" x-text="t('peakNote').replace('{w}', peak.weeks)"></div>
      </section>

      <footer class="footer">
        <span x-text="t('footer1')"></span><br>
        <span x-text="t('footer2')"></span>
      </footer>
    </div>

    <!-- ===================== หน้าผังช่องจอด ===================== -->
    <div x-show="view === 'map'" x-cloak>
      <div class="sticky-top map-sticky">
      <header class="map-header">
        <button type="button" class="round-btn" @click="closeMap()" :aria-label="t('back')">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <div>
          <h1 class="map-title" x-text="t('mapOf') + ' ' + (mapZone ? zoneName(mapZone) : '')"></h1>
          <div class="muted-sm" x-show="mapZone && mapZone.free !== null">
            <span x-text="t('free')"></span> <b class="c-free" x-text="mapZone ? mapZone.free : ''"></b>
            <span x-text="t('of') + ' ' + (mapZone ? mapZone.capacity : '') + ' ' + t('slots') + ' · ' + t('updatedAt') + ' ' + formattedUpdatedAt"></span>
          </div>
        </div>
      </header>

      <div class="banner banner-warn" role="status" x-show="stale">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5M12 18h.01"/></svg>
        <div class="banner-text" x-text="t('staleTitle')"></div>
      </div>

      <div class="legend">
        <span><i class="lg lg-free"></i><span x-text="t('free')"></span></span>
        <span><i class="lg lg-taken"></i><span x-text="t('occupied')"></span></span>
        <span><i class="lg lg-locked"></i><span x-text="t('locked')"></span></span>
        <span><i class="lg lg-acc"></i><span x-text="t('disabled')"></span></span>
        <span><i class="lg lg-ev"></i><span>EV</span></span>
        <span><i class="lg lg-unknown"></i><span x-text="t('unknown')"></span></span>
      </div>
      </div>

      <div class="lot-heads">
        <div x-text="colRange(mapLeft)"></div>
        <div></div>
        <div x-text="colRange(mapRight)"></div>
      </div>

      <div class="lot">
        <div class="lot-col">
          <template x-for="slot in mapLeft" :key="slot.code">
            <button type="button" class="slot" :class="slotClass(slot)" @click="selected = slot.code" :aria-label="slot.code + ' ' + slotLabel(slot)">
              <span class="slot-inner" x-html="slotContent(slot, false)"></span>
            </button>
          </template>
        </div>
        <div class="aisle" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          <span class="aisle-label" x-text="t('aisle')"></span>
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
        </div>
        <div class="lot-col">
          <template x-for="slot in mapRight" :key="slot.code">
            <button type="button" class="slot slot-right" :class="slotClass(slot)" @click="selected = slot.code" :aria-label="slot.code + ' ' + slotLabel(slot)">
              <span class="slot-inner" x-html="slotContent(slot, true)"></span>
            </button>
          </template>
        </div>
      </div>

      <section class="card sel-card" x-show="selectedSlot">
        <div class="sel-badge" :class="selectedSlot ? 'b-' + slotKind(selectedSlot) : ''" x-text="selectedSlot ? selectedSlot.code : ''"></div>
        <div>
          <div class="sel-label" :class="selectedSlot ? 'c-' + slotKind(selectedSlot) : ''" x-text="selectedSlot ? slotLabel(selectedSlot) : ''"></div>
          <div class="muted-sm" x-text="selectedSlot && selectedSlot.state === 'locked' ? t('selHintLocked') : t('selHint')"></div>
        </div>
      </section>
      <div class="footer" x-show="!selectedSlot" x-text="t('tapHint')"></div>
    </div>

    <!-- ไอคอนที่ใช้ซ้ำ -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <g id="car">
          <rect x="1" y="2" width="62" height="26" rx="9" fill="#fb7185"/>
          <rect x="38" y="5" width="11" height="20" rx="3" fill="#3f0d17" opacity=".7"/>
          <rect x="10" y="6" width="8" height="18" rx="3" fill="#3f0d17" opacity=".55"/>
          <rect x="18" y="6" width="20" height="18" rx="3" fill="#fda4af"/>
        </g>
        <g id="lock" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </g>
        <g id="wheelchair" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="4" r="2"/><path d="M11 7v6h6l2 5"/><path d="M8 10.5a6 6 0 1 0 8.5 7.5"/>
        </g>
      </defs>
    </svg>
  </div>

  <script>window.PUBLIC_DISPLAY = {{ branding().public | tojson }};</script>

        noAvailableSlots: "No available slots",
        viewMap: "View parking map",
        peakTitle: "Busy times",
        peakNote: "Average of the same weekday over the last {w} weeks · blue bar is the current hour",
        footer1: "Counted by AI from cameras; may be slightly inaccurate",
        footer2: "Camera images are never published, to protect visitors' privacy",
        back: "Back to overview",
        mapOf: "Map ·",
        aisle: "Driveway",
        tapHint: "Tap a slot for details",
        selHint: "AI status may be slightly inaccurate",
        selHintLocked: "Set aside by the site staff",
        lblFree: "Free",
        lblAcc: "Free · accessible slot",
        lblEv: "Free · EV charging slot",
        lblTaken: "Occupied",
        lblLocked: "Reserved, not open for parking",
        lblUnknown: "Status unknown",
        days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
        allSites: "All parking sites",
        sitesCount: "{n} sites",
        freeTotal: "free in total",
        viewDetail: "View details",
        navigate: "Directions",
        navigateHere: "Get directions (maps app)",
        openHours: "Open",
        backToSites: "Back to all sites",
        nearMe: "Sort by distance from me",
        sortedNear: "Sorted by distance",
        geoDenied: "Location permission denied; showing the default order",
        km: "km away",
        stFree: "Available",
        stFull: "Full",
        stClosed: "Temporarily closed",
        stStale: "Data may be out of date",
        stNoData: "No data yet",
      },
    };

    const RING_CIRCUMFERENCE = 2 * Math.PI * 84;
    const ICON_CAR = '<svg class="car" viewBox="0 0 64 30" aria-hidden="true"><use href="#car"/></svg>';
    const ICON_LOCK = '<svg class="icon c-locked" viewBox="0 0 24 24" aria-hidden="true"><use href="#lock"/></svg>';
    const ICON_ACC = '<svg class="icon c-acc" viewBox="0 0 24 24" aria-hidden="true"><use href="#wheelchair"/></svg>';
    const ICON_EV = '<svg class="icon c-free" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>';

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function publicPage() {
      return {
        lang: "th",
        // ส่วนที่แสดง/ซ่อนได้ ตั้งที่หลังบ้าน: ตั้งค่าระบบ → ระบบและการแสดงผล
        show: window.PUBLIC_DISPLAY || {},
        view: "",  // กำหนดใน route() หลังโหลดรายการสถานที่ (กันหน้ากระพริบ)
        sites: [],
        siteCode: null,
        multiSite: false,
        distances: null,
        geoError: "",
        mapZoneCode: null,
        selected: null,
        site: { name_th: "", name_en: "" },
        total: { free: 0, capacity: 0, free_disabled: 0, free_ev: 0, excluded_zones: [] },
        zones: [],
        updatedAt: null,
        stale: false,
        peak: { weekday: 0, now_hour: 0, weeks: 4, points: [] },

        async init() {
          this.lang = this.show.lang_switch ? this._resolveLang() : "th";
          document.documentElement.lang = this.lang;
          await this.fetchSites();
          this.route();
          window.addEventListener("popstate", () => this.route());
          setInterval(() => (this.view === "sites" ? this.fetchSites() : this.fetchSummary()), 30000);
          setInterval(() => this.fetchPeak(), 600000);
        },

        // ---------- เส้นทางในหน้า: #site-CODE และ #site-CODE/map-ZONE ----------
        route() {
          const m = location.hash.match(/^#site-([^/]+)(?:\/map-(.+))?$/);
          const legacyMap = location.hash.match(/^#map-(.+)$/);  // ลิงก์รูปแบบเดิม (สถานที่เดียว)
          let code = m ? decodeURIComponent(m[1]) : null;
          let zone = m && m[2] ? decodeURIComponent(m[2]) : legacyMap ? decodeURIComponent(legacyMap[1]) : null;
          if (!this.show.slot_map) zone = null;  // ปิดผังช่องจอดไว้ ลิงก์เก่าเปิดแค่หน้าสถานที่
          if (code && !this.sites.some((s) => s.code === code)) code = null;
          if (!code && !this.multiSite && this.sites.length) code = this.sites[0].code;
          if (!code) {
            this.view = "sites";
            this.fetchSites();
            return;
          }
          if (code !== this.siteCode) this.switchSite(code);
          if (zone) {
            this.mapZoneCode = zone;
            this.selected = null;
            this.view = "map";
          } else {
            this.view = "overview";
          }
        },

        switchSite(code) {
          this.siteCode = code;
          this.zones = [];
          this.total = { free: 0, capacity: 0, free_disabled: 0, free_ev: 0, excluded_zones: [] };
          this.peak = { weekday: 0, now_hour: 0, weeks: 4, points: [] };
          const s = this.sites.find((x) => x.code === code);
          if (s) this.site = { name_th: s.name_th, name_en: s.name_en, address: s.address, opening_hours: s.opening_hours, maps_url: s.maps_url };
          this.fetchSummary();
          this.fetchPeak();
        },

        go(hash) {
          if (location.hash !== hash) history.pushState(null, "", hash || location.pathname + location.search);
          this.route();
          window.scrollTo(0, 0);
        },

        openSite(code) { this.go("#site-" + encodeURIComponent(code)); },
        backToSites() { this.go(""); },

        async fetchSites() {
          try {
            const resp = await fetch("/api/public/sites");
            if (!resp.ok) return;
            this.sites = await resp.json();
            this.multiSite = this.sites.length > 1;
          } catch (e) {
            // เงียบไว้ รอบถัดไป poll ใหม่เอง
          }
        },

        siteName(s) { return this.lang === "th" ? s.name_th : s.name_en; },

        siteStatusText(s) {
          if (s.status === "ok") return this.t("stFree") + " " + s.free + " " + this.t("slots");
          return this.t({ full: "stFull", closed: "stClosed", stale: "stStale", no_data: "stNoData" }[s.status] || "stNoData");
        },

        get sortedSites() {
          if (!this.distances) return this.sites;
          const d = (s) => this.distances[s.code] ?? Infinity;
          return [...this.sites].sort((a, b) => d(a) - d(b));
        },

        distanceText(s) {
          const km = this.distances ? this.distances[s.code] : undefined;
          if (km === undefined) return "";
          return (km < 10 ? km.toFixed(1) : Math.round(km)) + " " + this.t("km");
        },

        // ตำแหน่งของผู้ใช้คำนวณระยะทางในเครื่องเท่านั้น ไม่ส่งไปที่เซิร์ฟเวอร์
        sortByDistance() {
          if (!navigator.geolocation) { this.geoError = this.t("geoDenied"); return; }
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const { latitude, longitude } = pos.coords;
              const rad = (x) => (x * Math.PI) / 180;
              const out = {};
              for (const s of this.sites) {
                if (s.latitude === null || s.longitude === null) continue;
                const dLat = rad(s.latitude - latitude);
                const dLon = rad(s.longitude - longitude);
                const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(latitude)) * Math.cos(rad(s.latitude)) * Math.sin(dLon / 2) ** 2;
                out[s.code] = 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
              }
              this.distances = out;
              this.geoError = "";
            },
            () => { this.geoError = this.t("geoDenied"); },
            { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
          );
        },

        t(key) {
          return STRINGS[this.lang][key] ?? key;
        },

        _resolveLang() {
          const params = new URLSearchParams(window.location.search);
          const fromUrl = params.get("lang");
          if (fromUrl === "th" || fromUrl === "en") {
            document.cookie = `lang=${fromUrl}; path=/; max-age=31536000`;
            return fromUrl;
          }
          const match = document.cookie.match(/(^| )lang=(th|en)( |$)/);
          return match ? match[2] : "th";
        },

        toggleLang() {
          this.lang = this.lang === "th" ? "en" : "th";
          document.documentElement.lang = this.lang;
          document.cookie = `lang=${this.lang}; path=/; max-age=31536000`;
        },

        async fetchSummary() {
          try {
            if (!this.siteCode) return;
            const requested = this.siteCode;
            const resp = await fetch("/api/public/summary?site=" + encodeURIComponent(requested));
            if (!resp.ok) return;
            const data = await resp.json();
            if (requested !== this.siteCode) return; // ผู้ใช้เปลี่ยนสถานที่ระหว่างรอ
            this.site = data.site;
            this.total = data.total;
            this.zones = data.zones;
            this.updatedAt = data.updated_at;
            this.stale = data.stale;
          } catch (e) {
            // เงียบไว้ รอบถัดไป poll ใหม่เอง
          }
        },

        async fetchPeak() {
          try {
            if (!this.siteCode || !this.show.peak_chart) return;
            const requested = this.siteCode;
            const resp = await fetch("/api/public/peak?site=" + encodeURIComponent(requested));
            if (resp.ok && requested === this.siteCode) this.peak = await resp.json();
          } catch (e) {
            // ไม่มีกราฟก็ยังใช้หน้าเว็บได้ปกติ
          }
        },

        zoneName(zone) {
          return this.lang === "th" ? zone.name_th : zone.name_en;
        },

        // ---------- ยอดรวม ----------
        get countableZones() {
          return this.zones.filter((z) => z.status === "ok" || z.status === "partial");
        },

        get counts() {
          let occupied = 0;
          let locked = 0;
          let unknown = 0;
          for (const z of this.countableZones) {
            for (const s of z.slots || []) {
              if (s.state === "occupied") occupied++;
              if (s.state === "locked") locked++;
              if (s.state === "unknown") unknown++;
            }
          }
          return { occupied, locked, unknown };
        },

        get isFull() {
          return !this.stale && this.total.capacity > 0 && this.total.free === 0;
        },

        get ringDash() {
          const ratio = this.total.capacity > 0 ? this.total.free / this.total.capacity : 0;
          return `${(RING_CIRCUMFERENCE * ratio).toFixed(1)} ${RING_CIRCUMFERENCE.toFixed(1)}`;
        },

        noBreak(code) {
          // ใช้ขีดแบบไม่ตัดบรรทัด ไม่ให้ "A-10" ถูกตัดเป็น "A-" กับ "10"
          return String(code).replace(/-/g, "\u2011");
        },

        freeCodes(zone) {
          // ใช้ zone.slots ตัวเดียวกับแผนผัง -> จำนวนรหัสตรงกับ zone.free เสมอ
          return (zone.slots || []).filter((s) => s.state === "free").map((s) => s.code);
        },

        // ---------- ช่องจอด ----------
        slotKind(slot) {
          if (slot.state === "locked") return "locked";
          if (slot.state === "occupied") return "taken";
          if (slot.state === "unknown") return "unknown";
          if (slot.type === "disabled") return "acc";
          if (slot.type === "ev") return "ev";
          return "free";
        },

        slotLabel(slot) {
          const map = { free: "lblFree", acc: "lblAcc", ev: "lblEv", taken: "lblTaken", locked: "lblLocked", unknown: "lblUnknown" };
          return this.t(map[this.slotKind(slot)]);
        },

        slotClass(slot) {
          return "k-" + this.slotKind(slot) + (this.selected === slot.code ? " is-selected" : "");
        },

        slotContent(slot, rightSide) {
          const code = `<span class="slot-code">${escapeHtml(slot.code)}</span>`;
          const kind = this.slotKind(slot);
          let icon = "";
          if (kind === "taken") icon = ICON_CAR;
          else if (kind === "locked") icon = ICON_LOCK;
          else if (kind === "acc") icon = ICON_ACC;
          else if (kind === "ev") icon = ICON_EV;
          else if (kind === "free") icon = `<span class="slot-tag">${escapeHtml(this.t("free"))}</span>`;
          else icon = '<span class="slot-tag">?</span>';
          return rightSide ? code + icon : icon + code;
        },

        // ---------- ผังช่องจอด ----------
        get mapZone() {
          return this.zones.find((z) => z.code === this.mapZoneCode) || null;
        },

        get mapSlots() {
          return this.mapZone ? this.mapZone.slots || [] : [];
        },

        get mapLeft() {
          return this.mapSlots.slice(0, Math.ceil(this.mapSlots.length / 2));
        },

        get mapRight() {
          return this.mapSlots.slice(Math.ceil(this.mapSlots.length / 2));
        },

        get selectedSlot() {
          return this.mapSlots.find((s) => s.code === this.selected) || null;
        },

        colRange(list) {
          if (!list.length) return "";
          return list.length === 1 ? list[0].code : `${list[0].code} – ${list[list.length - 1].code}`;
        },

        openMap(code) {
          this.go("#site-" + encodeURIComponent(this.siteCode) + "/map-" + encodeURIComponent(code));
        },

        closeMap() {
          this.go("#site-" + encodeURIComponent(this.siteCode));
        },

        // ---------- กราฟช่วงเวลาหนาแน่น ----------
        get peakBars() {
          const pts = this.peak.points;
          if (!pts.length) return [];
          const byHour = Object.fromEntries(pts.map((p) => [p.hour, p.avg_occ_pct]));
          const minH = Math.min(6, ...pts.map((p) => p.hour));
          const maxH = Math.max(20, ...pts.map((p) => p.hour));
          const bars = [];
          for (let h = minH; h <= maxH; h++) {
            const pct = byHour[h] ?? 0;
            let cls = "bar-low";
            if (h === this.peak.now_hour) cls = "bar-now";
            else if (pct >= 70) cls = "bar-high";
            bars.push({ hour: h, height: Math.max(pct, 2), cls });
          }
          return bars;
        },

        get peakAria() {
          const top = [...this.peak.points].sort((a, b) => b.avg_occ_pct - a.avg_occ_pct)[0];
          if (!top) return "";
          return `${this.t("peakTitle")}: ${String(top.hour).padStart(2, "0")}:00 ${Math.round(top.avg_occ_pct)}%`;
        },

        dayName(weekday) {
          return this.t("days")[weekday] || "";
        },

        get formattedUpdatedAt() {
          if (!this.updatedAt) return this.t("never");
          const d = new Date(this.updatedAt + "Z");
          const locale = this.lang === "th" ? "th-TH" : "en-GB";
          const time = d.toLocaleTimeString(locale, { hour: "2-digit", minute: "2-digit" });
          // ข้อมูลค้างข้ามวัน ต้องบอกวันที่ด้วย ไม่งั้นประชาชนเข้าใจผิดว่าเป็นข้อมูลวันนี้
          if (d.toDateString() === new Date().toDateString()) return time + (this.lang === "th" ? " น." : "");
          return d.toLocaleDateString(locale, { day: "numeric", month: "short" }) + " " + time + (this.lang === "th" ? " น." : "");
        },
      };
    }
  </script>
