{% extends "admin/base.html" %}
{% block title %}ตั้งค่าระบบ{% endblock %}
{% block content %}
<div x-data="settingsPage()" x-init="init()">
  <div class="card" x-show="isOperator">
    <p>หน้านี้ (ตั้งค่าระบบ) สำหรับ Admin เท่านั้น</p>
  </div>

  <template x-if="!isOperator">
  <div>
    <div class="tab-bar sticky-bar" role="tablist">
      <button type="button" role="tab" :class="tab === 'system' && 'active'" :aria-selected="tab === 'system'" @click="go('system')"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>ระบบและการแสดงผล</button>
      <button type="button" role="tab" :class="tab === 'counting' && 'active'" :aria-selected="tab === 'counting'" @click="go('counting')"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>การนับช่องจอด</button>
      <button type="button" role="tab" :class="tab === 'mail' && 'active'" :aria-selected="tab === 'mail'" @click="go('mail')"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>อีเมลและลิงก์คำเชิญ</button>
      <button type="button" role="tab" :class="tab === 'security' && 'active'" :aria-selected="tab === 'security'" @click="go('security')"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>ความปลอดภัย</button>
      <button type="button" role="tab" :class="tab === 'backup' && 'active'" :aria-selected="tab === 'backup'" @click="go('backup')"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>สำรองข้อมูล</button>
    </div>


    <!-- ================= ระบบและการแสดงผล ================= -->
    <template x-if="tab === 'system' && sys">
    <div>
      <div class="card" style="margin-bottom:1rem;">
        <h2 class="card-title"><svg class="title-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>ตั้งค่าระบบ</h2>
        <div class="form-grid">
          <div>
            <label for="s-org">ชื่อระบบ / หน่วยงาน</label>
            <input id="s-org" type="text" maxlength="120" x-model="sys.display.org_name" placeholder="เช่น เทศบาลเมืองสระบุรี">
            <p class="hint">แสดงที่มุมซ้ายบนของแถบเมนู · ว่าง = แสดง NASLINK</p>
          </div>
          <div>
            <label for="s-title">ข้อความหัวจอ</label>
            <input id="s-title" type="text" maxlength="200" x-model="sys.display.system_title" placeholder="เช่น ระบบบริหารจัดการที่จอดรถอัจฉริยะ เทศบาลเมืองสระบุรี">
            <p class="hint">แสดงกลางแถบด้านบนของทุกเมนู (จอกว้างเท่านั้น) · เว้นว่าง = ไม่แสดง</p>
          </div>
        </div>
        <div class="logo-row">
          <div class="logo-preview" :class="sys.display.logo_file && 'has-logo'">
            <template x-if="sys.display.logo_file"><img :src="'/branding/logo?v=' + sys.display.logo_version" alt="โลโก้ปัจจุบัน"></template>
            <template x-if="!sys.display.logo_file">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9.5 16V8h3.2a2.6 2.6 0 0 1 0 5.2H9.5"/></svg>
            </template>
          </div>
          <div style="min-width:0;">
            <label style="margin-top:0;">โลโก้</label>
            <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
              <label class="btn btn-secondary file-btn" :class="logoBusy && 'disabled'">
                <input type="file" accept="image/png,image/jpeg,image/webp" @change="uploadLogo($event)" :disabled="logoBusy">
                <span x-text="logoBusy ? 'กำลังอัปโหลด...' : (sys.display.logo_file ? 'เปลี่ยนโลโก้...' : 'อัปโหลดโลโก้...')"></span>
              </label>
              <button type="button" class="btn-secondary" x-show="sys.display.logo_file" @click="deleteLogo()" :disabled="logoBusy">ใช้โลโก้ตั้งต้น</button>
            </div>
            <p class="hint">PNG, JPG หรือ WebP ไม่เกิน 1 MB · แนะนำภาพสี่เหลี่ยมจัตุรัส 256×256 พิกเซล พื้นหลังโปร่งใส · แสดงที่มุมซ้ายบนและหน้าเข้าสู่ระบบ · มีผลทันที</p>
            <p class="error-text" x-show="logoError" x-text="logoError" style="margin:0;"></p>
          </div>
        </div>
        <div class="toggle-list">
          <label class="toggle-row">
            <span><b>แสดงข้อความหัวจอ</b><span class="sub-text">ตัวอักษรสีน้ำเงินกลางแถบด้านบน</span></span>
            <span class="switch"><input type="checkbox" x-model="sys.display.show_system_title"><span class="switch-track"></span></span>
          </label>
          <label class="toggle-row">
            <span><b>แสดงที่อยู่ Server ใต้โลโก้</b><span class="sub-text">เช่น 125.26.22.145:8010 — ช่วยให้รู้ว่ากำลังใช้เครื่องไหน</span></span>
            <span class="switch"><input type="checkbox" x-model="sys.display.show_server_address"><span class="switch-track"></span></span>
          </label>
          <label class="toggle-row">
            <span><b>แสดงชื่อผู้พัฒนาและเวอร์ชันท้ายแถบเมนู</b><span class="sub-text">NASLINK Solutions · Smart Parking {{ app_version }}</span></span>
            <span class="switch"><input type="checkbox" x-model="sys.display.show_sidebar_footer"><span class="switch-track"></span></span>
          </label>
        </div>
      </div>

      <div class="card" style="margin-bottom:1rem;">
        <div class="card-head">
          <h2 class="card-title" style="margin:0;"><svg class="title-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>หน้าสาธารณะ (สำหรับประชาชน)</h2>
          <a class="btn btn-secondary" href="/?from=admin" target="_blank" rel="noopener" data-public-link>เปิดดูหน้าสาธารณะ</a>
        </div>
        <p class="muted" style="margin-top:0;">เลือกส่วนที่จะแสดงบนหน้าเว็บที่ประชาชนเปิดดูที่ว่าง — จำนวนที่ว่างและสถานะโซนแสดงเสมอ · มีผลภายใน 30 วินาทีหลังบันทึก (ผู้ชมต้องโหลดหน้าใหม่)</p>
        <div class="toggle-list">
          <template x-for="item in publicItems" :key="item.key">
            <label class="toggle-row">
              <span><b x-text="item.title"></b><span class="sub-text" x-text="item.detail"></span></span>
              <span class="switch"><input type="checkbox" x-model="sys.display.public[item.key]"><span class="switch-track"></span></span>
            </label>
          </template>
        </div>
      </div>

      <div class="card" style="margin-bottom:1rem;">
        <h2 class="card-title"><svg class="title-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3l2-3h8l2 3h3v12H3z"/><circle cx="12" cy="13" r="4"/></svg>การตรวจสถานะกล้อง</h2>
        <p class="muted" style="margin-top:0;">
          ระบบเทียบภาพปัจจุบันของกล้องกับภาพอ้างอิง (บันทึกไว้ตอนวาดผังช่องจอด) ถ้าภาพเลื่อนเกินเกณฑ์ หรือหาจุดสังเกตร่วมไม่พอ
          จะแจ้งเตือน "กล้องอาจถูกขยับ" และเสนอให้ Re-align ช่องจอด · กล้องที่ดึงภาพไม่ได้จะแจ้ง "ขาดการเชื่อมต่อ" ทันทีทุกรอบตรวจจับ
        </p>
        <div class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
          <div>
            <label for="s-mode">ตรวจกล้องถูกขยับ</label>
            <select id="s-mode" x-model="movedMode">
              <option value="on">เปิด (แนะนำ)</option>
              <option value="off">ปิด</option>
            </select>
          </div>
          <div>
            <label for="s-int">ตรวจทุก (นาที)</label>
            <input id="s-int" type="number" min="1" max="120" x-model.number="sys.health.moved_check_interval_min" :disabled="movedMode === 'off'">
          </div>
          <div>
            <label for="s-px">เกณฑ์ภาพเลื่อน (พิกเซล)</label>
            <input id="s-px" type="number" min="10" max="300" x-model.number="sys.health.moved_threshold_px" :disabled="movedMode === 'off'">
          </div>
        </div>
        <p class="hint">ค่าเริ่มต้น ตรวจทุก 10 นาที เกณฑ์ 50 พิกเซล · เกณฑ์ต่ำ = ไวขึ้นแต่อาจแจ้งเตือนผิดเมื่อลมพัดเสากล้อง · เกณฑ์สูง = แจ้งเฉพาะกล้องที่ขยับชัดเจน</p>
        <p class="notice warn" x-show="movedMode === 'off'" style="margin:0.5rem 0 0;">ปิดการตรวจแล้ว ถ้ากล้องถูกขยับ ระบบจะนับช่องจอดผิดโดยไม่แจ้งเตือน — ควรเปิดไว้เสมอในการใช้งานจริง</p>
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; margin-top:0.75rem;">
          <button class="btn-secondary" type="button" @click="checkNow()" :disabled="checking || movedMode === 'off'">
            <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg>
            <span x-text="checking ? 'กำลังสั่ง...' : 'ตรวจสถานะเดี๋ยวนี้'"></span>
          </button>
          <span class="muted" x-show="checkResult" x-text="checkResult"></span>
        </div>
      </div>

      <div class="save-bar">
        <button type="button" @click="saveSystem()" :disabled="sysSaving" x-text="sysSaving ? 'กำลังบันทึก...' : 'บันทึกการตั้งค่า'"></button>
        <span class="notice ok" x-show="sysSaved" x-text="sysSaved" style="margin:0;"></span>
        <span class="error-text" x-show="sysError" x-text="sysError" style="margin:0;"></span>
      </div>
    </div>
    </template>

    <!-- รูปแบบจอฝั่งประชาชน ในเมนู "แสดงกล้องและช่องจอดจริง" -->
    <template x-if="tab === 'system' && showcase">
    <div class="card" style="margin-top:1rem;">
      <h3 style="margin-top:0;">หน้าแสดงกล้องและช่องจอดจริง</h3>
      <p class="hint" style="margin-top:0;">เลือกรูปแบบจอฝั่ง "หน้าจอประชาชน" ที่แสดงคู่กับภาพกล้องสด (ใช้ตอนนำเสนองาน)</p>
      <div class="sc-style-pick" role="radiogroup" aria-label="รูปแบบหน้าจอประชาชน">
        <label class="sc-style-opt" :class="showcase && showcase.style === 'grid' && 'on'">
          <input type="radio" name="sc-style" value="grid" x-model="showcase.style">
          <span class="sc-prev sc-prev-grid" aria-hidden="true"><i class="g"></i><i class="r"></i><i class="r"></i><i class="g"></i><i class="r"></i><i class="g"></i><i class="r"></i><i class="r"></i></span>
          <b>ผังช่องจอด</b><small>ช่องสี่เหลี่ยมพร้อมรหัส แตะช่องเพื่อชี้บนภาพกล้อง</small>
        </label>
        <label class="sc-style-opt" :class="showcase && showcase.style === 'ring' && 'on'">
          <input type="radio" name="sc-style" value="ring" x-model="showcase.style">
          <span class="sc-prev sc-prev-ring" aria-hidden="true"><span class="ring"></span><span class="bars"><i></i><i></i><i></i><i></i></span></span>
          <b>แบบหน้าประชาชน</b><small>วงแหวนช่องว่าง ตัวเลขแยกสถานะ และการ์ดโซน (ธีมเข้ม)</small>
        </label>
      </div>
      <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap; margin-top:0.75rem;">
        <button type="button" @click="saveShowcase()" :disabled="showcaseBusy" x-text="showcaseBusy ? 'กำลังบันทึก...' : 'บันทึกรูปแบบ'"></button>
        <a href="/admin/showcase" class="btn btn-secondary">เปิดหน้าแสดงกล้องและช่องจอดจริง</a>
        <span class="muted" x-show="showcaseMsg" x-text="showcaseMsg"></span>
      </div>
    </div>
    </template>

    <!-- ================= อีเมลและลิงก์คำเชิญ ================= -->
    <div class="card" x-show="tab === 'mail'">
      <h2 style="margin-top:0;">อีเมลและลิงก์คำเชิญ</h2>
      <div class="form-grid">
        <div>
          <label for="m-base">URL ของระบบ (ใช้สร้างลิงก์คำเชิญ)</label>
          <input id="m-base" type="text" x-model="mail.base_url" placeholder="https://125.26.22.145:8010" style="font-family:ui-monospace,Consolas,monospace;">
          <p class="hint">ที่อยู่ที่ผู้รับคำเชิญใช้เปิดระบบได้ — ว่าง = ใช้ <span x-text="mail.effective_base_url"></span></p>
        </div>
        <div>
          <label for="m-days">ลิงก์คำเชิญหมดอายุใน (วัน)</label>
          <input id="m-days" type="number" min="1" max="30" x-model.number="mail.default_expiry_days">
          <p class="hint">ค่าเริ่มต้นตอนสร้างคำเชิญ (1–30 วัน) ลิงก์ตั้งรหัสผ่านใหม่ใช้ 1 วันเสมอ</p>
        </div>
      </div>

      <hr style="border:0; border-top:1px solid var(--color-border); margin:1rem 0;">
      <h3 style="margin:0 0 0.25rem;">การส่งอีเมล (SMTP)</h3>
      <p class="hint" style="margin-bottom:0.5rem;">ใช้ส่งคำเชิญและลิงก์ตั้งรหัสผ่านใหม่ทางอีเมล ถ้าไม่ตั้งค่า ยังสร้างลิงก์คำเชิญไปส่งทาง LINE ได้ตามปกติ</p>
      <p class="notice warn" x-show="mail.source === 'env'" style="margin:0 0 0.5rem;">ตอนนี้ใช้ค่า SMTP จากไฟล์ .env อยู่ ถ้ากรอกและบันทึกในหน้านี้ ระบบจะใช้ค่าจากหน้านี้แทน</p>
      <div style="display:flex; gap:0.4rem; align-items:center; flex-wrap:wrap; margin-bottom:0.5rem;">
        <span class="hint" style="margin:0;">ตั้งค่าด่วน:</span>
        <button type="button" class="chip" @click="preset('gmail')">Gmail</button>
        <button type="button" class="chip" @click="preset('outlook')">Outlook / Microsoft 365</button>
        <button type="button" class="chip" @click="preset('ssl')">SSL (พอร์ต 465)</button>
      </div>
      <div class="form-grid" style="grid-template-columns: 2fr 1fr;">
        <div>
          <label for="m-host">SMTP Host</label>
          <input id="m-host" type="text" x-model="mail.host" placeholder="smtp.gmail.com" style="font-family:ui-monospace,Consolas,monospace;">
        </div>
        <div>
          <label for="m-port">Port</label>
          <input id="m-port" type="number" min="1" max="65535" x-model.number="mail.port">
        </div>
      </div>
      <div class="form-grid">
        <div>
          <label for="m-user">Username</label>
          <input id="m-user" type="text" x-model="mail.user" autocomplete="off" placeholder="you@gmail.com">
        </div>
        <div>
          <label for="m-pass">Password</label>
          <input id="m-pass" type="password" x-model="password" autocomplete="new-password" :placeholder="mail.has_password ? '••••••••' : ''">
          <p class="hint" x-show="mail.has_password">มีรหัสผ่านบันทึกไว้แล้ว (เว้นว่าง = คงเดิม)
            <a href="#" @click.prevent="clearPassword = !clearPassword" x-text="clearPassword ? '· ยกเลิกการลบ' : '· ลบรหัสที่บันทึกไว้'"></a></p>
          <p class="hint" x-show="clearPassword" style="color:var(--color-danger);">จะลบรหัสผ่านที่บันทึกไว้เมื่อกดบันทึก</p>
          <p class="hint">Gmail ต้องใช้ "รหัสผ่านสำหรับแอป" (App Password) 16 ตัว ไม่ใช่รหัส Gmail ปกติ</p>
        </div>
        <div>
          <label for="m-sec">การเข้ารหัส</label>
          <select id="m-sec" x-model="mail.security">
            <option value="starttls">STARTTLS (587)</option>
            <option value="ssl">SSL/TLS (465)</option>
            <option value="none">ไม่เข้ารหัส (ไม่แนะนำ)</option>
          </select>
        </div>
      </div>
      <label for="m-from">ชื่อผู้ส่ง (From)</label>
      <input id="m-from" type="text" x-model="mail.from_address" placeholder="NASLINK Smart Parking <you@gmail.com>">
      <p class="hint">เช่น "NASLINK Smart Parking &lt;you@gmail.com&gt;" — ว่าง = ใช้ Username</p>

      <div style="display:flex; gap:0.5rem; margin-top:1rem; flex-wrap:wrap;">
        <button @click="saveMail()" :disabled="saving" x-text="saving ? 'กำลังบันทึก...' : 'บันทึก'"></button>
      </div>
      <p class="notice ok" x-show="mailSaved" x-text="mailSaved" style="margin-top:0.75rem;"></p>
      <p class="error-text" x-show="mailError" x-text="mailError"></p>

      <hr style="border:0; border-top:1px solid var(--color-border); margin:1rem 0;">
      <label for="m-test">ส่งอีเมลทดสอบไปที่</label>
      <div class="link-box">
        <input id="m-test" type="email" x-model="testTo" placeholder="your@email.com" style="font-family:inherit;">
        <button class="btn-secondary" @click="testMail()" :disabled="testing" x-text="testing ? 'กำลังส่ง...' : 'ส่งอีเมลทดสอบ'"></button>
      </div>
      <p class="hint">กดบันทึกก่อนทดสอบ ระบบใช้ค่าที่บันทึกไว้ล่าสุด</p>
      <p class="notice ok" x-show="testResult && testOk" x-text="testResult" style="margin-top:0.5rem;"></p>
      <p class="notice warn" x-show="testResult && !testOk" x-text="testResult" style="margin-top:0.5rem;"></p>
    </div>

    <!-- ================= ความปลอดภัย: ตรวจตาม TOR 5.1 ================= -->
    <!-- ================= อีเมลแจ้งเตือนผู้ดูแล ================= -->
    <div class="card" x-show="tab === 'mail' && am" style="margin-top:1rem;">
      <h2 style="margin-top:0;">อีเมลแจ้งเตือนผู้ดูแล</h2>
      <p class="muted" style="margin-top:0;">ส่งอีเมลเมื่อเกิดเรื่องที่ต้องไปดูหน้างาน (ใช้ค่าการส่งอีเมลชุดเดียวกับคำเชิญด้านบน) · หลายเรื่องในเวลาใกล้กันรวมเป็นอีเมลฉบับเดียว</p>
      <p class="notice warn" x-show="am && !am.smtp_ready" style="margin:0 0 0.75rem;">ยังไม่ได้ตั้งค่าการส่งอีเมล (SMTP) ด้านบน — ตั้งให้เรียบร้อยและกด "ส่งอีเมลทดสอบ" ก่อน</p>
      <template x-if="am">
        <div>
          <label class="check-line"><input type="checkbox" x-model="am.enabled"> <b>เปิดอีเมลแจ้งเตือน</b></label>
          <div class="section-title" style="margin-top:0.75rem;">เรื่องที่ส่ง</div>
          <template x-for="(label, key) in am.kind_labels" :key="key">
            <label class="check-line"><input type="checkbox" x-model="am.kinds[key]" :disabled="!am.enabled"> <span x-text="label"></span></label>
          </template>
          <label class="check-line"><input type="checkbox" x-model="am.send_resolved" :disabled="!am.enabled"> ส่งอีเมล "กลับมาปกติ" เมื่อปัญหาหายเอง</label>
          <div class="form-grid" style="margin-top:0.5rem;">
            <div>
              <label for="am-delay">ส่งเมื่อปัญหาค้างนานเกิน (นาที)</label>
              <input id="am-delay" type="number" min="0" max="120" x-model.number="am.delay_min" :disabled="!am.enabled">
              <p class="hint">กันกล้องหลุดแวบเดียวแล้วส่งอีเมลรัว · แนะนำ 5 นาที</p>
            </div>
            <div>
              <label for="am-extra">อีเมลผู้รับเพิ่มเติม</label>
              <textarea id="am-extra" rows="3" x-model="am.extra" :disabled="!am.enabled" placeholder="1 บรรทัดต่อ 1 อีเมล" style="width:100%;"></textarea>
            </div>
          </div>
          <label class="check-line"><input type="checkbox" x-model="am.to_admins" :disabled="!am.enabled"> ส่งถึง Admin ทุกคนที่มีอีเมลในระบบ</label>
          <p class="hint" x-text="'ผู้รับตอนนี้ (ตามค่าที่บันทึกแล้ว): ' + (am.recipients.length ? am.recipients.length + ' อีเมล' : 'ยังไม่มี')"></p>
          <div style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; margin-top:0.5rem;">
            <button @click="saveAlertMail()" :disabled="amBusy" x-text="amBusy ? 'กำลังบันทึก...' : 'บันทึกอีเมลแจ้งเตือน'"></button>
            <button class="btn-secondary" @click="testAlertMail()" :disabled="amBusy || !am.recipients.length">ส่งอีเมลแจ้งเตือนทดสอบ</button>
            <span class="muted" x-show="amMsg" x-text="amMsg"></span>
            <span class="error-text" x-show="amError" x-text="amError"></span>
          </div>
        </div>
      </template>
    </div>

    <div class="card" x-show="tab === 'security'" style="margin-bottom:1rem;">
      <h2 style="margin-top:0;">ตรวจความปลอดภัยของระบบ</h2>
      <p class="muted" style="margin-top:0;">ตรวจจากค่าที่ระบบใช้งานอยู่จริงตอนนี้ — ใช้ประกอบการตรวจรับได้</p>
      <template x-for="c in checks" :key="c.key">
        <div class="check-row" :class="c.state">
          <span class="check-icon" aria-hidden="true" x-text="c.state === 'ok' ? '✓' : (c.state === 'warn' ? '!' : '✕')"></span>
          <div><div style="font-weight:600;" x-text="c.title"></div><div class="sub-text" x-text="c.detail"></div></div>
        </div>
      </template>
    </div>

    <!-- ================= สำรองข้อมูล ================= -->
    <!-- ================= การนับช่องจอด ================= -->
    <div class="card" x-show="tab === 'counting'" style="margin-bottom:1rem;">
      <h2 style="margin-top:0;">การนับช่องจอด</h2>
      <p class="muted" style="margin-top:0;">
        เลือกว่าสถานที่และกล้องไหน <b>นับรวม</b> ในยอดช่องว่าง/ยอดรวม (หน้าสาธารณะ ภาพรวมทุกสถานที่ รายงานและสถิติ) ·
        กล้องทดสอบ เช่น <b>ValidationTestCam</b> ควรปิดไว้ — กล้องที่ไม่นับยังตรวจจับตามปกติ ดูได้ที่หน้าสถานะสดและทดสอบความแม่นยำได้
      </p>
      <p class="hint">สถานที่ที่ไม่นับ: ทุกกล้องของสถานที่นั้นไม่นับ และไม่แสดงในหน้าสาธารณะ</p>
      <template x-if="counting">
        <div class="count-scope">
          <template x-for="st in countingGroups()" :key="st.key">
            <div class="count-site" :class="st.site && !st.site.counted && 'off'">
              <label class="count-row count-site-row">
                <input type="checkbox" x-show="st.site" :checked="st.site && st.site.counted" @change="st.site.counted = $event.target.checked; countingDirty = true">
                <span class="count-name" x-text="st.site ? st.site.name : 'ไม่ระบุสถานที่'"></span>
                <span class="state-tag" :class="!st.site || st.site.counted ? 'active' : 'inactive'" x-text="!st.site || st.site.counted ? 'นับรวม' : 'ไม่นับ'"></span>
              </label>
              <template x-for="cam in st.cameras" :key="cam.id">
                <label class="count-row count-cam-row" :class="(!cam.counted || (st.site && !st.site.counted)) && 'off'">
                  <input type="checkbox" :checked="cam.counted" :disabled="st.site && !st.site.counted" @change="cam.counted = $event.target.checked; countingDirty = true">
                  <span class="count-name" x-text="'📷 ' + cam.name"></span>
                  <span class="muted" style="font-size:0.85rem;" x-text="cam.slot_count + ' ช่อง' + (cam.enabled ? '' : ' · ปิดใช้งาน')"></span>
                </label>
              </template>
              <p class="hint" x-show="!st.cameras.length" style="margin:0.25rem 0 0 1.9rem;">ยังไม่มีกล้อง</p>
            </div>
          </template>
          <p class="notice ok" x-show="countingTotal() !== null" x-text="countingTotal()" style="margin:0.75rem 0 0;"></p>
        </div>
      </template>
      <div style="display:flex; gap:0.5rem; align-items:center; margin-top:0.75rem; flex-wrap:wrap;">
        <button @click="saveCounting()" :disabled="countingSaving || !countingDirty" :class="countingDirty && 'btn-next'" x-text="countingSaving ? 'กำลังบันทึก...' : 'บันทึกการนับช่องจอด'"></button>
        <span class="muted" x-show="countingSaved" x-text="countingSaved"></span>
        <span class="error-text" x-show="countingError" x-text="countingError"></span>
      </div>
    </div>

    <div class="card" x-show="tab === 'backup'">
      <h2 style="margin-top:0;">สำรองฐานข้อมูลอัตโนมัติ</h2>
      <p class="muted" style="margin-top:0;">
        ระบบสำรองฐานข้อมูลให้เองทุกวันเวลา <b x-text="String(backup.hour).padStart(2, '0') + ':00 น.'"></b>
        เก็บ <b x-text="backup.keep"></b> ชุดล่าสุด และตรวจความสมบูรณ์ของไฟล์ทุกครั้ง (ไม่ต้องตั้ง cron บนเครื่อง Server)
      </p>
      <div class="check-row" :class="backup.status && backup.status.ok ? 'ok' : 'fail'" x-show="backup.status">
        <span class="check-icon" aria-hidden="true" x-text="backup.status && backup.status.ok ? '✓' : '✕'"></span>
        <div>
          <div style="font-weight:600;" x-text="backup.status ? ('สำรองล่าสุด ' + fmtLocal(backup.status.time)) : ''"></div>
          <div class="sub-text" x-text="backup.status ? backup.status.message : ''"></div>
          <div class="sub-text" x-show="backup.status && backup.status.copy" x-text="backup.status && backup.status.copy ? backup.status.copy.message : ''"
               :style="backup.status && backup.status.copy && !backup.status.copy.ok && 'color:var(--color-danger)'"></div>
        </div>
      </div>
      <p class="notice warn" x-show="!backup.status" style="margin:0 0 0.75rem;">ยังไม่เคยสำรอง — กด "สำรองตอนนี้" หรือรอ worker สำรองให้ในรอบถัดไป</p>
      <p class="hint" x-text="'มีไฟล์สำรองครอบคลุม ' + backup.days_covered + ' วัน (ต้องไม่น้อยกว่า 7 วัน)'"></p>
      <p class="hint" x-show="backup.copy_dir" x-text="'คัดลอกไปเก็บนอกเครื่องที่: ' + backup.copy_dir"></p>
      <p class="hint" x-show="!backup.copy_dir">แนะนำ: ตั้ง BACKUP_COPY_DIR ให้คัดลอกไปเก็บที่ NAS ด้วย (ดู README หัวข้อ สำรองข้อมูล)</p>

      <div style="display:flex; gap:0.5rem; margin:0.75rem 0;">
        <button @click="backupNow()" :disabled="backingUp" x-text="backingUp ? 'กำลังสำรอง...' : 'สำรองตอนนี้'"></button>
      </div>
      <p class="error-text" x-show="backupError" x-text="backupError"></p>

      <div class="table-scroll" x-show="backup.files.length">
        <table class="data-table">
          <thead><tr><th>ไฟล์</th><th>เวลา</th><th style="text-align:right;">ขนาด</th></tr></thead>
          <tbody>
            <template x-for="f in backup.files" :key="f.name">
              <tr>
                <td style="font-family:ui-monospace,Consolas,monospace; font-size:0.85rem;" x-text="f.name"></td>
                <td x-text="fmtLocal(f.created_at)"></td>
                <td style="text-align:right;" x-text="(f.size / 1048576).toFixed(2) + ' MB'"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <p class="hint" style="margin-top:0.75rem;">ไฟล์อยู่ในโฟลเดอร์ data/backups บนเครื่อง Server · วิธีกู้คืนดู README หัวข้อ สำรองข้อมูล</p>
    </div>

    <!-- ================= จำกัด IP ================= -->
    <div class="card" x-show="tab === 'security'">
      <h2 style="margin-top:0;">จำกัด IP เข้าหลังบ้าน</h2>
      <p class="muted">
        หน้า login เข้าได้จากทุก IP เสมอ (ป้องกันล็อกตัวเองออกจากระบบ) แต่การทำงานอื่นๆ ทั้งหมด
        หลัง login จะถูกบล็อกถ้า IP ไม่อยู่ในรายการด้านล่าง — ถ้าเปิดใช้แต่ยังไม่ใส่รายการ จะยังไม่บล็อกใครเลย
      </p>
      <p>IP ของคุณตอนนี้: <b x-text="yourIp"></b>
        <button class="btn-secondary" @click="addMyIp()" type="button">+ เพิ่ม IP ของฉัน</button>
      </p>

      <label><input type="checkbox" x-model="enabled" style="width:auto;"> เปิดใช้การจำกัด IP</label>

      <label style="margin-top:0.5rem;">รายการ IP หรือ CIDR (บรรทัดละ 1 รายการ เช่น 203.0.113.5 หรือ 192.168.1.0/24)</label>
      <textarea x-model="ipsText" rows="6" style="width:100%; font-family:monospace;"></textarea>

      <button @click="save()" style="margin-top:0.75rem;" :disabled="loading">บันทึก</button>
      <p class="error-text" x-show="error" x-text="error"></p>
      <p class="muted" x-show="savedMessage" x-text="savedMessage"></p>
    </div>
  </div>
  </template>
</div>

<script>
  const SMTP_PRESETS = {
    gmail: { host: "smtp.gmail.com", port: 587, security: "starttls" },
    outlook: { host: "smtp.office365.com", port: 587, security: "starttls" },
    ssl: { port: 465, security: "ssl" },
  };

  function settingsPage() {
    return {
      isOperator: false,
      tab: "system",
      // ระบบและการแสดงผล
      sys: null, movedMode: "on", logoBusy: false, logoError: "", sysSaving: false, sysSaved: "", sysError: "", checking: false, checkResult: "",
      publicItems: [
        { key: "lang_switch", title: "ปุ่มสลับภาษา ไทย / EN", detail: "ปิด = แสดงภาษาไทยอย่างเดียว" },
        { key: "directions", title: "ปุ่มนำทาง (Google Maps)", detail: "แสดงเมื่อสถานที่มีพิกัด" },
        { key: "nearby_sort", title: "ปุ่มเรียงสถานที่ใกล้ฉัน", detail: "ใช้ตำแหน่งจากมือถือผู้ชม (กรณีมีหลายสถานที่)" },
        { key: "free_list", title: "รายการรหัสช่องที่ว่าง", detail: "เช่น ว่าง: A01, A05, A12" },
        { key: "slot_map", title: "ปุ่มดูผังช่องจอด", detail: "ผังแสดงช่องว่าง/ไม่ว่างรายช่อง (ไม่มีภาพจากกล้อง)" },
        { key: "peak_chart", title: "กราฟช่วงเวลาที่คนจอดมาก", detail: "คำนวณจากข้อมูลย้อนหลัง 4 สัปดาห์ของวันเดียวกัน" },
      ],
      // ความปลอดภัย
      enabled: false, ipsText: "", yourIp: "", loading: false, error: "", savedMessage: "",
      // อีเมล
      mail: { base_url: "", default_expiry_days: 3, host: "", port: 587, user: "", from_address: "", security: "starttls", has_password: false, source: "none", effective_base_url: "" },
      password: "", clearPassword: false, saving: false, mailSaved: "", mailError: "",
      testTo: "", testing: false, testResult: "", testOk: false,
      // ตรวจ TOR 5.1 + สำรองข้อมูล
      checks: [], backup: { files: [], keep: 14, hour: 3, days_covered: 0, status: null, copy_dir: null }, backingUp: false, backupError: "",

      // อีเมลแจ้งเตือน
      am: null, amBusy: false, amMsg: "", amError: "",
      async loadAlertMail() { this.am = await apiJson("/api/admin/settings/alert-mail"); },
      async saveAlertMail() {
        this.amBusy = true; this.amMsg = ""; this.amError = "";
        try {
          const { enabled, kinds, delay_min, send_resolved, to_admins, extra } = this.am;
          this.am = await apiJson("/api/admin/settings/alert-mail", { method: "PUT", body: JSON.stringify({ enabled, kinds, delay_min, send_resolved, to_admins, extra }) });
          this.amMsg = this.am.enabled ? `บันทึกแล้ว — ส่งถึง ${this.am.recipients.length} อีเมล` : "บันทึกแล้ว (ปิดอีเมลแจ้งเตือน)";
        } catch (e) { this.amError = e.message; } finally { this.amBusy = false; }
      },
      async testAlertMail() {
        this.amBusy = true; this.amMsg = ""; this.amError = "";
        try {
          const res = await apiJson("/api/admin/settings/alert-mail/test", { method: "POST" });
          this.amMsg = `ส่งอีเมลทดสอบแล้ว ${res.sent.length} อีเมล` + (res.failed.length ? ` · ไม่สำเร็จ ${res.failed.length}: ${res.failed[0]}` : "");
        } catch (e) { this.amError = e.message; } finally { this.amBusy = false; }
      },

      // รูปแบบหน้าแสดงกล้องและช่องจอดจริง
      showcase: null, showcaseBusy: false, showcaseMsg: "",
      async loadShowcase() { this.showcase = await apiJson("/api/admin/settings/showcase"); },
      async saveShowcase() {
        this.showcaseBusy = true; this.showcaseMsg = "";
        try {
          this.showcase = await apiJson("/api/admin/settings/showcase", { method: "PUT", body: JSON.stringify(this.showcase) });
          this.showcaseMsg = "บันทึกแล้ว — หน้าที่เปิดอยู่จะเปลี่ยนรูปแบบภายใน 10 วินาที";
        } catch (e) { this.showcaseMsg = "บันทึกไม่สำเร็จ: " + e.message; } finally { this.showcaseBusy = false; }
      },

      // การนับช่องจอด
      counting: null, countingDirty: false, countingSaving: false, countingSaved: "", countingError: "",
      async loadCounting() { this.counting = await apiJson("/api/admin/settings/counting"); this.countingDirty = false; },
      countingGroups() {
        const c = this.counting;
        const groups = c.sites.map((site) => ({ key: "s" + site.id, site, cameras: c.cameras.filter((cam) => cam.site_id === site.id) }));
        const orphan = c.cameras.filter((cam) => !c.sites.some((st) => st.id === cam.site_id));
        if (orphan.length) groups.push({ key: "none", site: null, cameras: orphan });
        return groups;
      },
      countingTotal() {
        if (!this.counting) return null;
        const siteOn = (id) => { const st = this.counting.sites.find((x) => x.id === id); return !st || st.counted; };
        const on = this.counting.cameras.filter((cam) => cam.counted && siteOn(cam.site_id));
        return `นับรวม ${on.length} กล้อง · ${on.reduce((n, cam) => n + cam.slot_count, 0)} ช่อง (ช่องที่ Publish แล้ว)` + (this.countingDirty ? " — ยังไม่ได้บันทึก" : "");
      },
      async saveCounting() {
        this.countingSaving = true; this.countingError = ""; this.countingSaved = "";
        try {
          const body = {
            sites: this.counting.sites.map((st) => ({ id: st.id, counted: st.counted })),
            cameras: this.counting.cameras.map((cam) => ({ id: cam.id, counted: cam.counted })),
          };
          const res = await apiJson("/api/admin/settings/counting", { method: "PUT", body: JSON.stringify(body) });
          this.counting = res; this.countingDirty = false;
          this.countingSaved = res.changed ? `บันทึกแล้ว (${res.changed} รายการ) — มีผลทันที` : "ไม่มีการเปลี่ยนแปลง";
        } catch (e) {
          this.countingError = "บันทึกไม่สำเร็จ: " + e.message;
        } finally { this.countingSaving = false; }
      },

      async init() {
        const user = await requireAuth();
        if (!user) return;
        this.isOperator = user.role !== "admin";
        if (this.isOperator) return;
        if (location.hash === "#mail") this.tab = "mail";
        if (location.hash === "#security") this.tab = "security";
        if (location.hash === "#backup") this.tab = "backup";
        if (location.hash === "#counting") this.tab = "counting";
        await Promise.all([this.loadSystem(), this.load(), this.loadMail(), this.loadChecks(), this.loadBackup(), this.loadCounting(), this.loadAlertMail(), this.loadShowcase()]);
      },

      // ---------- ระบบและการแสดงผล ----------
      async loadSystem() {
        const data = await apiJson("/api/admin/settings/system");
        this.sys = { display: data.display, health: data.health };
        this.movedMode = data.health.moved_check_enabled ? "on" : "off";
      },
      async saveSystem() {
        this.sysSaving = true; this.sysSaved = ""; this.sysError = "";
        try {
          const body = { display: this.sys.display, health: { ...this.sys.health, moved_check_enabled: this.movedMode === "on" } };
          const data = await apiJson("/api/admin/settings/system", { method: "PUT", body: JSON.stringify(body) });
          this.sys = { display: data.display, health: data.health };
          this.sysSaved = "บันทึกแล้ว — กำลังโหลดหน้าใหม่เพื่อแสดงผล...";
          setTimeout(() => location.reload(), 900);
        } catch (e) {
          this.sysError = "บันทึกไม่สำเร็จ: " + e.message;
        } finally { this.sysSaving = false; }
      },
      async uploadLogo(event) {
        const file = event.target.files && event.target.files[0];
        event.target.value = "";
        if (!file) return;
        this.logoError = "";
        if (file.size > 1024 * 1024) { this.logoError = "ไฟล์ใหญ่เกิน 1 MB — ย่อขนาดภาพก่อน"; return; }
        const form = new FormData();
        form.append("file", file);
        this.logoBusy = true;
        try {
          const data = await apiJson("/api/admin/settings/system/logo", { method: "POST", body: form });
          this.sys.display.logo_file = data.display.logo_file;
          this.sys.display.logo_version = data.display.logo_version;
          this.refreshBrandLogo();
        } catch (e) {
          this.logoError = "อัปโหลดไม่สำเร็จ: " + e.message;
        } finally { this.logoBusy = false; }
      },
      async deleteLogo() {
        this.logoBusy = true; this.logoError = "";
        try {
          const data = await apiJson("/api/admin/settings/system/logo", { method: "DELETE" });
          this.sys.display.logo_file = data.display.logo_file;
          this.sys.display.logo_version = data.display.logo_version;
          this.refreshBrandLogo();
        } catch (e) {
          this.logoError = "ไม่สำเร็จ: " + e.message;
        } finally { this.logoBusy = false; }
      },
      // เปลี่ยนโลโก้ในแถบเมนูทันทีโดยไม่โหลดหน้าใหม่ (ข้อมูลที่ยังไม่ได้กดบันทึกจะไม่หาย)
      refreshBrandLogo() {
        const mark = document.querySelector(".sidebar .brand-mark");
        if (!mark) return;
        if (this.sys.display.logo_file) {
          mark.classList.add("has-logo");
          mark.innerHTML = "";
          const img = document.createElement("img");
          img.src = "/branding/logo?v=" + this.sys.display.logo_version;
          img.alt = "";
          mark.appendChild(img);
        } else {
          location.reload();
        }
      },
      async checkNow() {
        this.checking = true; this.checkResult = "";
        try {
          const r = await apiJson("/api/admin/settings/system/check-now", { method: "POST" });
          this.checkResult = r.cameras
            ? `สั่งแล้ว — ระบบจะตรวจกล้อง ${r.cameras} ตัวในรอบตรวจจับถัดไป ดูผลที่เมนู "การแจ้งเตือน"`
            : "ยังไม่มีกล้องที่เปิดใช้งาน";
        } catch (e) {
          this.checkResult = "สั่งไม่สำเร็จ: " + e.message;
        } finally { this.checking = false; }
      },
      async loadChecks() { this.checks = await apiJson("/api/admin/settings/security-status").catch(() => []); },
      async loadBackup() { this.backup = await apiJson("/api/admin/settings/backup"); },
      fmtLocal(iso) {
        // เวลาไฟล์สำรองเป็นเวลาท้องถิ่นของ Server อยู่แล้ว (ไม่ใช่ UTC)
        const [d, t] = iso.split("T");
        const [y, m, day] = d.split("-").map(Number);
        const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
        return `${day} ${months[m - 1]} ${y + 543} ${t.slice(0, 5)} น.`;
      },
      async backupNow() {
        this.backingUp = true; this.backupError = "";
        try {
          await apiJson("/api/admin/settings/backup/run", { method: "POST" });
          await Promise.all([this.loadBackup(), this.loadChecks()]);
        } catch (e) {
          this.backupError = e.message;
        } finally { this.backingUp = false; }
      },
      go(tab) { this.tab = tab; history.replaceState(null, "", "#" + tab); },

      // ---------- อีเมล ----------
      async loadMail() {
        this.mail = await apiJson("/api/admin/settings/mail");
        this.password = ""; this.clearPassword = false;
      },
      preset(name) { Object.assign(this.mail, SMTP_PRESETS[name]); },
      async saveMail() {
        this.saving = true; this.mailSaved = ""; this.mailError = "";
        try {
          const body = { ...this.mail, clear_password: this.clearPassword };
          if (this.password) body.password = this.password;
          this.mail = await apiJson("/api/admin/settings/mail", { method: "PUT", body: JSON.stringify(body) });
          this.password = ""; this.clearPassword = false;
          this.mailSaved = this.mail.host ? "บันทึกแล้ว ลองกด \"ส่งอีเมลทดสอบ\" เพื่อตรวจว่าใช้งานได้" : "บันทึกแล้ว (ไม่ได้ใส่ SMTP Host = ระบบไม่ส่งอีเมลเอง)";
        } catch (e) {
          this.mailError = "บันทึกไม่สำเร็จ: " + e.message;
        } finally { this.saving = false; }
      },
      async testMail() {
        this.testing = true; this.testResult = "";
        try {
          await apiJson("/api/admin/mail/test", { method: "POST", body: JSON.stringify({ to: this.testTo }) });
          this.testOk = true;
          this.testResult = `ส่งอีเมลทดสอบถึง ${this.testTo} แล้ว ตรวจกล่องจดหมาย (และโฟลเดอร์สแปม)`;
        } catch (e) {
          this.testOk = false; this.testResult = e.message;
        } finally { this.testing = false; }
      },

      // ---------- ความปลอดภัย ----------
      async load() {
        const data = await apiJson("/api/admin/settings");
        this.enabled = data.ip_allowlist.enabled;
        this.ipsText = data.ip_allowlist.ips.join("\n");
        this.yourIp = data.your_ip;
      },
      addMyIp() {
        const lines = this.ipsText.split("\n").map((s) => s.trim()).filter(Boolean);
        if (!lines.includes(this.yourIp)) lines.push(this.yourIp);
        this.ipsText = lines.join("\n");
      },
      async save() {
        this.loading = true; this.error = ""; this.savedMessage = "";
        const ips = this.ipsText.split("\n").map((s) => s.trim()).filter(Boolean);
        try {
          await apiJson("/api/admin/settings/ip-allowlist", { method: "PUT", body: JSON.stringify({ enabled: this.enabled, ips }) });
          this.savedMessage = "บันทึกแล้ว";
        } catch (e) {
          this.error = "บันทึกไม่สำเร็จ: " + e.message;
        } finally { this.loading = false; }
      },
    };
  }
</script>
{% endblock %}
