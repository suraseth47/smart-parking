<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ - Smart Parking</title>
  <link rel="stylesheet" href="/static/css/admin.css?v=20261030a">
  <script defer src="/static/js/vendor/alpine.min.js"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-box card" x-data="loginForm()">
      <div class="brand" style="padding:0 0 1rem; margin-bottom:0.5rem;">
        {% set brand = branding() %}
        {% if brand.logo_file %}
        <span class="brand-mark has-logo" aria-hidden="true"><img src="/branding/logo?v={{ brand.logo_version }}" alt=""></span>
        {% else %}
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><rect x="3" y="8" width="18" height="8" rx="4"/><circle cx="8" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>
        </span>
        {% endif %}
        <span class="brand-text">{{ brand.org_name or "NASLINK" }}<small>Smart Parking</small></span>
      </div>
      <h1>เข้าสู่ระบบหลังบ้าน</h1>
      <form @submit.prevent="submit">
        <label for="username">ชื่อผู้ใช้ หรืออีเมล</label>
        <input id="username" type="text" x-model="username" autocomplete="username" required>

        <label for="password">รหัสผ่าน</label>
        <input id="password" type="password" x-model="password" autocomplete="current-password" required>

        <button type="submit" :disabled="loading" style="margin-top:1rem; width:100%">
          <span x-show="!loading">เข้าสู่ระบบ</span>
          <span x-show="loading">กำลังเข้าสู่ระบบ...</span>
        </button>
        <p class="error-text" x-show="error" x-text="error"></p>
      </form>
    </div>
  </div>

  <script>
    function loginForm() {
      return {
        username: "",
        password: "",
        error: "",
        loading: false,
        async submit() {
          this.loading = true;
          this.error = "";
          try {
            const resp = await fetch("/api/admin/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username: this.username, password: this.password }),
            });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok) {
              this.error = data.detail || "เข้าสู่ระบบไม่สำเร็จ";
              return;
            }
            // ไปหน้าแรกที่บัญชีนี้มีสิทธิ์
            const perms = data.permissions || [];
            const firstPage = { cameras: "/admin", live: "/admin/live", cctv: "/admin/cctv", override: "/admin/override", reports: "/admin/reports", zones: "/admin/zones" };
            const key = data.role === "admin" ? "cameras" : ["live", "cctv", "override", "reports", "zones"].find((k) => perms.includes(k));
            window.location.href = firstPage[key] || "/admin/live";
          } catch (e) {
            this.error = "เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ";
          } finally {
            this.loading = false;
          }
        },
      };
    }
  </script>
</body>
</html>
