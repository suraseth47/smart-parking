{% extends "admin/base.html" %}
{% block title %}กล้อง{% endblock %}
{% block head %}
<script src="/static/js/vendor/konva.min.js"></script>
{% endblock %}
{% block content %}
<div x-data="dashboard()" x-init="init()">
  <div class="card" x-show="isOperator" style="margin-bottom:1rem;">
    <p>หน้านี้ (จัดการกล้อง) สำหรับ Admin เท่านั้น — <a href="/admin/live">ไปหน้า Live view</a> แทน</p>
  </div>

  <template x-if="!isOperator">
  <div>
  <div class="card" style="margin-bottom:1rem;">
    <h2 style="margin-top:0;">กล้อง</h2>
    <p class="muted" x-show="cameras.length === 0">ยังไม่มีกล้อง เพิ่มกล้องแรกด้านล่าง</p>
    <table style="width:100%; border-collapse:collapse;" x-show="cameras.length > 0">
      <thead>
        <tr style="text-align:left; border-bottom:1px solid var(--color-border);">
          <th style="padding:0.4rem;">ชื่อ</th>
          <th style="padding:0.4rem;">ยี่ห้อ</th>
          <th style="padding:0.4rem;">โฮสต์</th>
          <th style="padding:0.4rem;">สถานะ</th>
          <th style="padding:0.4rem;"></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="cam in cameras" :key="cam.id">
          <tr style="border-bottom:1px solid var(--color-border);">
            <td style="padding:0.4rem;" x-text="cam.name"></td>
            <td style="padding:0.4rem;" x-text="cam.brand"></td>
            <td style="padding:0.4rem;" x-text="cam.host"></td>
            <td style="padding:0.4rem;" x-text="cam.status"></td>
            <td style="padding:0.4rem;">
              <a class="btn" :href="'/admin/layout?camera_id=' + cam.id">กำหนดช่องจอด</a>
              <button x-show="cam.status === 'moved'" class="btn-secondary" @click="openRealign(cam)">Re-align</button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

  <div class="card" x-show="realign" style="margin-bottom:1rem;">
    <h2 style="margin-top:0;">Re-align กล้อง: <span x-text="realign && realign.cameraName"></span></h2>
    <p class="muted" x-show="realign && !realign.transform_found">
      คำนวณตำแหน่งใหม่ไม่ได้ (หาจุดสังเกตร่วมกับภาพอ้างอิงไม่พอ) ลองใหม่อีกครั้ง หรือตรวจกล้องด้วยตา
    </p>
    <template x-if="realign && realign.transform_found">
      <div>
        <p class="muted">กรอบส้มเส้นประ = ตำแหน่งเดิม, กรอบเขียว = ตำแหน่งใหม่ที่เสนอ (<span x-text="realign.slots.length"></span> ช่อง)</p>
        <div id="realign-stage-container"></div>
        <div style="display:flex; gap:0.5rem; margin-top:0.75rem;">
          <button @click="confirmRealign()" :disabled="realignLoading">ยืนยัน Re-align</button>
          <button class="btn-secondary" @click="cancelRealign()">ยกเลิก</button>
        </div>
      </div>
    </template>
    <template x-if="realign && !realign.transform_found">
      <button class="btn-secondary" @click="cancelRealign()" style="margin-top:0.5rem;">ปิด</button>
    </template>
    <p class="error-text" x-show="realignError" x-text="realignError"></p>
  </div>

  <div class="card">
    <h2 style="margin-top:0;">เพิ่มกล้องใหม่</h2>
    <form @submit.prevent="createCamera">
      <label>ชื่อกล้อง</label>
      <input type="text" x-model="form.name" required>

      <label>ยี่ห้อ</label>
      <select x-model="form.brand">
        <option value="hikvision">Hikvision</option>
        <option value="dahua">Dahua</option>
        <option value="custom">Custom (กรอก RTSP URL เอง)</option>
      </select>

      <template x-if="form.brand !== 'custom'">
        <div>
          <label>IP กล้อง</label>
          <input type="text" x-model="form.host" placeholder="192.168.1.10">
          <label>Username</label>
          <input type="text" x-model="form.username">
          <label>Password</label>
          <input type="password" x-model="form.password">
          <label>Channel</label>
          <input type="number" x-model.number="form.channel" min="1">
        </div>
      </template>
      <template x-if="form.brand === 'custom'">
        <div>
          <label>RTSP URL (หรือ path ไฟล์วิดีโอ/ภาพสำหรับทดสอบ)</label>
          <input type="text" x-model="form.rtsp_url_custom" placeholder="rtsp://... หรือ data/samples/xxx.mp4">
        </div>
      </template>

      <button type="submit" style="margin-top:1rem;" :disabled="loading">เพิ่มกล้อง</button>
      <p class="error-text" x-show="error" x-text="error"></p>
    </form>
  </div>
  </div>
  </template>
</div>

<script>
  function dashboard() {
    return {
      cameras: [],
      isOperator: false,
      loading: false,
      error: "",
      realign: null,
      realignLoading: false,
      realignError: "",
      form: { name: "", brand: "hikvision", host: "", username: "", password: "", channel: 1, rtsp_url_custom: "" },
      async init() {
        const user = await requireAuth();
        if (!user) return;
        this.isOperator = user.role !== "admin";
        if (this.isOperator) return;  // จัดการกล้องเป็นสิทธิ์ Admin เท่านั้น
        await this.loadCameras();
      },
      async loadCameras() {
        this.cameras = await apiJson("/api/admin/cameras");
      },
      async createCamera() {
        this.loading = true;
        this.error = "";
        try {
          await apiJson("/api/admin/cameras", { method: "POST", body: JSON.stringify(this.form) });
          this.form = { name: "", brand: "hikvision", host: "", username: "", password: "", channel: 1, rtsp_url_custom: "" };
          await this.loadCameras();
        } catch (e) {
          this.error = e.message;
        } finally {
          this.loading = false;
        }
      },
      async openRealign(cam) {
        this.realignError = "";
        this.realign = null;
        try {
          const result = await apiJson(`/api/admin/cameras/${cam.id}/realign/preview`, { method: "POST" });
          this.realign = Object.assign(result, { cameraId: cam.id, cameraName: cam.name });
          if (result.transform_found) {
            this.$nextTick(() => renderRealignPreview(result.snapshot_url, result.slots));
          }
        } catch (e) {
          this.realignError = "ผิดพลาด: " + e.message;
        }
      },
      async confirmRealign() {
        if (!this.realign) return;
        this.realignLoading = true;
        try {
          await apiJson(`/api/admin/cameras/${this.realign.cameraId}/realign/confirm`, { method: "POST" });
          this.realign = null;
          await this.loadCameras();
        } catch (e) {
          this.realignError = "ยืนยันไม่สำเร็จ: " + e.message;
        } finally {
          this.realignLoading = false;
        }
      },
      cancelRealign() {
        this.realign = null;
        this.realignError = "";
      },
    };
  }

  async function renderRealignPreview(snapshotUrl, slots) {
    const container = document.getElementById("realign-stage-container");
    if (!container) return;
    const maxWidth = Math.min(900, container.closest(".card").clientWidth - 2);
    const img = new Image();
    const loaded = await new Promise((resolve) => {
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = snapshotUrl + `?t=${Date.now()}`;
    });
    if (!loaded) {
      container.innerHTML = '<p class="muted">โหลดภาพไม่สำเร็จ</p>';
      return;
    }
    const scale = Math.min(1, maxWidth / img.naturalWidth);
    const w = Math.round(img.naturalWidth * scale);
    const h = Math.round(img.naturalHeight * scale);

    container.innerHTML = "";
    const stage = new Konva.Stage({ container: "realign-stage-container", width: w, height: h });
    const bgLayer = new Konva.Layer();
    bgLayer.add(new Konva.Image({ image: img, width: w, height: h }));
    stage.add(bgLayer);
    const overlay = new Konva.Layer();
    stage.add(overlay);

    for (const slot of slots) {
      overlay.add(
        new Konva.Line({
          points: slot.old_polygon.flatMap(([x, y]) => [x * w, y * h]),
          closed: true,
          stroke: "#f97316",
          strokeWidth: 2,
          dash: [6, 4],
          listening: false,
        })
      );
      overlay.add(
        new Konva.Line({
          points: slot.new_polygon.flatMap(([x, y]) => [x * w, y * h]),
          closed: true,
          stroke: "#16a34a",
          strokeWidth: 2,
          listening: false,
        })
      );
    }
    overlay.draw();
  }
</script>
{% endblock %}
