{% extends "admin/base.html" %}
{% block title %}กล้องและช่องจอด{% endblock %}
{% block head %}
<script src="/static/js/vendor/konva.min.js"></script>
{% endblock %}
{% block content %}
<div x-data="dashboard()" x-init="init()">
  <section class="hero">
    <div>
      <div class="hero-eyebrow">SMART PARKING · <span x-text="isOperator ? 'OPERATOR' : 'ADMIN'"></span></div>
      <h2 class="hero-title">สวัสดี <span x-text="username"></span></h2>
      <div class="hero-sub" x-text="heroSub"></div>
    </div>
    <div class="hero-side" x-text="updatedLabel"></div>
  </section>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3l2-3h8l2 3h3v12H3z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
      <div>
        <div class="stat-label">กล้องทั้งหมด</div>
        <div class="stat-value" x-text="liveCams.length"></div>
        <div class="stat-note"><span class="ok" x-text="'● ' + camOnline + ' online'"></span> &nbsp; <span class="bad" x-text="'● ' + (liveCams.length - camOnline) + ' offline'"></span></div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 16V8h3.5a2.5 2.5 0 0 1 0 5H9"/></svg></div>
      <div>
        <div class="stat-label">ช่องจอดทั้งหมด</div>
        <div class="stat-value" x-text="totals.capacity"></div>
        <div class="stat-note" x-text="totals.locked ? ('ไม่รวมช่องสงวน ' + totals.locked + ' ช่อง') : 'ช่องที่เปิดให้จอด'"></div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg></div>
      <div>
        <div class="stat-label">ว่างตอนนี้</div>
        <div class="stat-value green" x-text="totals.free"></div>
        <div class="stat-note" x-text="'คนพิการ ' + totals.free_disabled + ' · EV ' + totals.free_ev"></div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon red"><svg viewBox="0 0 64 30" aria-hidden="true" style="stroke-width:3"><rect x="3" y="4" width="58" height="22" rx="8"/><path d="M20 6v18M42 6v18"/></svg></div>
      <div>
        <div class="stat-label">มีรถจอด</div>
        <div class="stat-value red" x-text="totals.occupied"></div>
        <div class="stat-note" x-text="totals.capacity ? ('ใช้งาน ' + Math.round(totals.occupied * 100 / totals.capacity) + '%') : '-'"></div>
      </div>
    </div>
  </div>
  <div class="card" x-show="isOperator" style="margin-bottom:1rem;">
    <p>หน้านี้ (จัดการกล้อง) สำหรับ Admin เท่านั้น — <a href="/admin/live">ไปหน้าสถานะช่องจอดสด</a> แทน</p>
  </div>

  <template x-if="!isOperator">
  <div>
  <div class="card" style="margin-bottom:1rem;">
    <h2 style="margin-top:0;">กล้อง</h2>
    <p class="muted" x-show="cameras.length === 0">ยังไม่มีกล้อง เพิ่มกล้องแรกด้านล่าง</p>
    <table style="width:100%; border-collapse:collapse;" x-show="cameras.length > 0">
      <thead>
        <tr style="text-align:left; border-bottom:1px solid var(--color-border);">
          <th style="padding:0.4rem;">ชื่อ</th>
          <th style="padding:0.4rem;">ยี่ห้อ</th>
          <th style="padding:0.4rem;">โฮสต์</th>
          <th style="padding:0.4rem;">สถานะ</th>
          <th style="padding:0.4rem;"></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="cam in cameras" :key="cam.id">
          <tr style="border-bottom:1px solid var(--color-border);">
            <td style="padding:0.4rem;">
              <span x-text="cam.name"></span>
              <div class="muted" style="font-size:0.8rem;" x-show="cam.large_object_min_area != null"
                   x-text="'นับวัตถุขนาดใหญ่เป็นรถ ≥ ' + formatPct(cam.large_object_min_area)"></div>
              <div class="muted" style="font-size:0.8rem;" x-show="cam.roi_auto_margin != null"
                   x-text="'ROI เฉพาะบริเวณช่องจอด (ขอบ ' + formatPct(cam.roi_auto_margin) + ')'"></div>
            </td>
            <td style="padding:0.4rem;" x-text="cam.brand"></td>
            <td style="padding:0.4rem;" x-text="cam.host"></td>
            <td style="padding:0.4rem;"><span class="status-pill" :class="cam.status" x-text="cam.status"></span></td>
            <td style="padding:0.4rem;">
              <a class="btn" :href="'/admin/layout?camera_id=' + cam.id">กำหนดช่องจอด</a>
              <button x-show="cam.status === 'moved'" class="btn-secondary" @click="openRealign(cam)">Re-align</button>
              <button class="btn-secondary" @click="openDetect(cam)">ตั้งค่าตรวจจับ</button>
              <button class="btn-secondary" style="color:var(--color-danger);" @click="askClearSlots(cam)">ลบช่องจอดทั้งหมด</button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

  <div class="card" x-show="clearTarget" style="margin-bottom:1rem; border-color:#fecaca; background:#fef2f2;">
    <h2 style="margin-top:0; color:var(--color-danger);">ลบช่องจอดทั้งหมดของกล้อง <span x-text="clearTarget && clearTarget.name"></span></h2>
    <p>ช่องจอดที่วาดไว้ทั้งหมดของกล้องนี้ รวมประวัติสถานะของแต่ละช่อง จะถูกลบถาวร ใช้เมื่อย้ายกล้องหรือเปลี่ยนมุมกล้องแล้วต้องการวาดใหม่ทั้งหมด</p>
    <p class="muted">ช่องจอดของกล้องอื่นไม่ถูกลบ หลังลบแล้วกด "กำหนดช่องจอด" เพื่อวาดใหม่ แล้วกด Publish</p>
    <div style="display:flex; gap:0.5rem; margin-top:0.75rem;">
      <button class="btn-danger" @click="confirmClearSlots()" :disabled="clearing">
        <span x-text="clearing ? 'กำลังลบ...' : 'ยืนยันลบทั้งหมด'"></span>
      </button>
      <button class="btn-secondary" @click="clearTarget = null" :disabled="clearing">ยกเลิก</button>
    </div>
    <p class="error-text" x-show="clearError" x-text="clearError"></p>
  </div>
  <div class="card" x-show="clearDone" style="margin-bottom:1rem; border-color:#bbf7d0; background:#ecfdf3;">
    <p style="margin:0;" x-text="clearDone"></p>
  </div>

  <div class="card" x-show="detectTarget" style="margin-bottom:1rem;">
    <h2 style="margin-top:0;">ตั้งค่าการตรวจจับ: <span x-text="detectTarget && detectTarget.name"></span></h2>
    <label style="display:flex; gap:0.5rem; align-items:center; font-weight:600;">
      <input type="checkbox" x-model="detectForm.enabled" style="width:auto; margin:0;">
      นับวัตถุขนาดใหญ่เป็นรถ
    </label>
    <p class="muted">
      ใช้กับกล้องที่มองรถจากด้านบนในระยะใกล้ ซึ่ง AI มักตีกรอบรถได้ตรง แต่ทายชื่อผิด (เช่น โทรศัพท์ กระเป๋า)
      เมื่อเปิดไว้ วัตถุที่กรอบใหญ่เกินขนาดที่กำหนดจะถูกนับเป็นรถด้วย
      ยกเว้นคน สัตว์ มอเตอร์ไซค์ และจักรยาน ซึ่งไม่นับเป็นรถเสมอ
    </p>
    <div x-show="detectForm.enabled">
      <label for="detect-min-area">ขนาดกรอบขั้นต่ำ (% ของพื้นที่ภาพ)</label>
      <input id="detect-min-area" type="number" min="0.5" max="50" step="0.5" x-model.number="detectForm.minAreaPct" style="max-width:160px;">
      <p class="muted" style="margin-top:0.25rem;">
        ค่าแนะนำ 3% · ตั้งต่ำไปอาจนับของชิ้นเล็กเป็นรถ ตั้งสูงไปรถที่อยู่ไกลกล้องจะไม่ถูกนับในโหมดนี้
        (รถที่ AI ทายถูกว่าเป็นรถยังนับตามปกติเสมอ)
      </p>
    </div>
    <hr style="border:0; border-top:1px solid var(--color-border); margin:1rem 0;">
    <label style="display:flex; gap:0.5rem; align-items:center; font-weight:600;">
      <input type="checkbox" x-model="detectForm.roiEnabled" style="width:auto; margin:0;">
      ตัดภาพเฉพาะบริเวณช่องจอด (ROI)
    </label>
    <p class="muted">
      ระบบตัดภาพเฉพาะส่วนที่มีช่องจอด (คำนวณจากช่องที่วาดไว้อัตโนมัติ) ก่อนส่งให้ AI ทิ้งท้องฟ้า ถนน และตึก
      รถจะใหญ่ขึ้นในสายตา AI โดยใช้ CPU เท่าเดิม ได้ผลมากกับกล้องความละเอียดสูงที่ช่องจอดอยู่ส่วนเดียวของภาพ
      และช่วยไม่ให้นับรถที่วิ่งบนถนนนอกลาน
    </p>
    <div x-show="detectForm.roiEnabled">
      <label for="detect-roi-margin">ขอบเผื่อรอบช่องจอด (% ของภาพ)</label>
      <input id="detect-roi-margin" type="number" min="0" max="50" step="1" x-model.number="detectForm.roiMarginPct" style="max-width:160px;">
      <p class="muted" style="margin-top:0.25rem;">
        ค่าแนะนำ 10% · ต้องเผื่อให้รถทั้งคันอยู่ในกรอบ ถ้าน้อยไปรถที่จอดเลยเส้นจะโดนตัดครึ่งคันแล้ว AI จำไม่ได้
        (ดูกรอบ ROI เส้นประสีฟ้าได้ในหน้า Preview)
      </p>
    </div>
    <p class="muted">หลังบันทึก กด "กำหนดช่องจอด" แล้วกด Preview เพื่อดูผลกับภาพปัจจุบันได้ทันที</p>
    <div style="display:flex; gap:0.5rem; margin-top:0.75rem;">
      <button @click="saveDetect()" :disabled="detectSaving">
        <span x-text="detectSaving ? 'กำลังบันทึก...' : 'บันทึก'"></span>
      </button>
      <button class="btn-secondary" @click="detectTarget = null" :disabled="detectSaving">ยกเลิก</button>
    </div>
    <p class="error-text" x-show="detectError" x-text="detectError"></p>
  </div>
  <div class="card" x-show="detectDone" style="margin-bottom:1rem; border-color:#bbf7d0; background:#ecfdf3;">
    <p style="margin:0;" x-text="detectDone"></p>
  </div>

  <div class="card" x-show="realign" style="margin-bottom:1rem;">
    <h2 style="margin-top:0;">Re-align กล้อง: <span x-text="realign && realign.cameraName"></span></h2>
    <p class="muted" x-show="realign && !realign.transform_found">
      คำนวณตำแหน่งใหม่ไม่ได้ (หาจุดสังเกตร่วมกับภาพอ้างอิงไม่พอ) ลองใหม่อีกครั้ง หรือตรวจกล้องด้วยตา
    </p>
    <template x-if="realign && realign.transform_found">
      <div>
        <p class="muted">กรอบส้มเส้นประ = ตำแหน่งเดิม, กรอบเขียว = ตำแหน่งใหม่ที่เสนอ (<span x-text="realign.slots.length"></span> ช่อง)</p>
        <div id="realign-stage-container"></div>
        <div style="display:flex; gap:0.5rem; margin-top:0.75rem;">
          <button @click="confirmRealign()" :disabled="realignLoading">ยืนยัน Re-align</button>
          <button class="btn-secondary" @click="cancelRealign()">ยกเลิก</button>
        </div>
      </div>
    </template>
    <template x-if="realign && !realign.transform_found">
      <button class="btn-secondary" @click="cancelRealign()" style="margin-top:0.5rem;">ปิด</button>
    </template>
    <p class="error-text" x-show="realignError" x-text="realignError"></p>
  </div>

  <div class="card">
    <h2 style="margin-top:0;">เพิ่มกล้องใหม่</h2>
    <form @submit.prevent="createCamera">
      <label>ชื่อกล้อง</label>
      <input type="text" x-model="form.name" required>

      <label>ยี่ห้อ</label>
      <select x-model="form.brand">
        <option value="hikvision">Hikvision</option>
        <option value="dahua">Dahua</option>
        <option value="custom">Custom (กรอก RTSP URL เอง)</option>
      </select>

      <template x-if="form.brand !== 'custom'">
        <div>
          <label>IP กล้อง</label>
          <input type="text" x-model="form.host" placeholder="192.168.1.10">
          <label>Username</label>
          <input type="text" x-model="form.username">
          <label>Password</label>
          <input type="password" x-model="form.password">
          <label>Channel</label>
          <input type="number" x-model.number="form.channel" min="1">
        </div>
      </template>
      <template x-if="form.brand === 'custom'">
        <div>
          <label>RTSP URL (หรือ path ไฟล์วิดีโอ/ภาพสำหรับทดสอบ)</label>
          <input type="text" x-model="form.rtsp_url_custom" placeholder="rtsp://... หรือ data/samples/xxx.mp4">
        </div>
      </template>

      <button type="submit" style="margin-top:1rem;" :disabled="loading">เพิ่มกล้อง</button>
      <p class="error-text" x-show="error" x-text="error"></p>
    </form>
  </div>
  </div>
  </template>
</div>

<script>
  function dashboard() {
    return {
      cameras: [],
      isOperator: false,
      username: "",
      liveCams: [],
      totals: { capacity: 0, free: 0, occupied: 0, locked: 0, free_disabled: 0, free_ev: 0 },
      updatedAt: null,
      get camOnline() {
        return this.liveCams.filter((c) => c.status === "online").length;
      },
      get heroSub() {
        return `ดูแล ${this.liveCams.length} กล้อง · ${this.totals.capacity} ช่องจอด · ว่าง ${this.totals.free} ช่อง`;
      },
      get updatedLabel() {
        if (!this.updatedAt) return "";
        const d = new Date(this.updatedAt + "Z");
        return "อัปเดตล่าสุด " + d.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }) + " น.";
      },
      async loadOverview() {
        try {
          this.liveCams = await apiJson("/api/admin/live/cameras");
          const resp = await fetch("/api/public/summary");
          if (!resp.ok) return;
          const data = await resp.json();
          let occupied = 0;
          let locked = 0;
          for (const z of data.zones) {
            if (z.status !== "ok" && z.status !== "partial") continue;
            for (const sl of z.slots || []) {
              if (sl.state === "occupied") occupied++;
              if (sl.state === "locked") locked++;
            }
          }
          this.totals = { ...data.total, occupied, locked };
          this.updatedAt = data.updated_at;
        } catch (e) {
          // ภาพรวมโหลดไม่ได้ ไม่กระทบส่วนจัดการกล้อง
        }
      },
      loading: false,
      error: "",
      realign: null,
      clearTarget: null,
      clearing: false,
      clearError: "",
      clearDone: "",
      askClearSlots(cam) {
        this.clearTarget = cam;
        this.clearError = "";
        this.clearDone = "";
      },
      async confirmClearSlots() {
        const cam = this.clearTarget;
        if (!cam) return;
        this.clearing = true;
        this.clearError = "";
        try {
          // ส่งรายการว่าง = ลบช่องจอดทั้งหมดของกล้องนี้ (พร้อมสถานะและประวัติของช่อง)
          await apiJson(`/api/admin/cameras/${cam.id}/slots`, { method: "PUT", body: JSON.stringify({ slots: [] }) });
          this.clearDone = `ลบช่องจอดทั้งหมดของกล้อง ${cam.name} แล้ว กด "กำหนดช่องจอด" เพื่อวาดใหม่`;
          this.clearTarget = null;
          this.loadOverview();
        } catch (e) {
          this.clearError = "ลบไม่สำเร็จ: " + e.message;
        } finally {
          this.clearing = false;
        }
      },
      detectTarget: null,
      detectForm: { enabled: false, minAreaPct: 3, roiEnabled: false, roiMarginPct: 10 },
      detectSaving: false,
      detectError: "",
      detectDone: "",
      formatPct(fraction) {
        return (Math.round(fraction * 1000) / 10) + "%";
      },
      openDetect(cam) {
        const current = cam.large_object_min_area;
        this.detectTarget = cam;
        const roi = cam.roi_auto_margin;
        this.detectForm = {
          enabled: current != null,
          minAreaPct: current != null ? Math.round(current * 1000) / 10 : 3,
          roiEnabled: roi != null,
          roiMarginPct: roi != null ? Math.round(roi * 1000) / 10 : 10,
        };
        this.detectError = "";
        this.detectDone = "";
      },
      async saveDetect() {
        const cam = this.detectTarget;
        if (!cam) return;
        const pct = Number(this.detectForm.minAreaPct);
        if (this.detectForm.enabled && (!(pct >= 0.5) || pct > 50)) {
          this.detectError = "ขนาดกรอบขั้นต่ำต้องอยู่ระหว่าง 0.5 ถึง 50%";
          return;
        }
        const roiPct = Number(this.detectForm.roiMarginPct);
        if (this.detectForm.roiEnabled && (!(roiPct >= 0) || roiPct > 50)) {
          this.detectError = "ขอบเผื่อ ROI ต้องอยู่ระหว่าง 0 ถึง 50%";
          return;
        }
        this.detectSaving = true;
        this.detectError = "";
        try {
          const body = {
            large_object_min_area: this.detectForm.enabled ? pct / 100 : null,
            roi_auto_margin: this.detectForm.roiEnabled ? roiPct / 100 : null,
          };
          await apiJson(`/api/admin/cameras/${cam.id}/detection`, { method: "PATCH", body: JSON.stringify(body) });
          const parts = [
            this.detectForm.enabled ? `นับวัตถุขนาดใหญ่เป็นรถ ≥ ${pct}%` : "ไม่นับวัตถุขนาดใหญ่",
            this.detectForm.roiEnabled ? `ROI ขอบ ${roiPct}%` : "ใช้ภาพเต็ม (ปิด ROI)",
          ];
          this.detectDone = `กล้อง ${cam.name}: ${parts.join(" · ")} — มีผลในรอบตรวจจับถัดไป`;
          this.detectTarget = null;
          await this.loadCameras();
        } catch (e) {
          this.detectError = "บันทึกไม่สำเร็จ: " + e.message;
        } finally {
          this.detectSaving = false;
        }
      },
      realignLoading: false,
      realignError: "",
      form: { name: "", brand: "hikvision", host: "", username: "", password: "", channel: 1, rtsp_url_custom: "" },
      async init() {
        const user = await requireAuth();
        if (!user) return;
        this.isOperator = user.role !== "admin";
        this.username = user.username;
        this.loadOverview();
        setInterval(() => this.loadOverview(), 30000);
        if (this.isOperator) return;  // จัดการกล้องเป็นสิทธิ์ Admin เท่านั้น
        await this.loadCameras();
      },
      async loadCameras() {
        this.cameras = await apiJson("/api/admin/cameras");
      },
      async createCamera() {
        this.loading = true;
        this.error = "";
        try {
          await apiJson("/api/admin/cameras", { method: "POST", body: JSON.stringify(this.form) });
          this.form = { name: "", brand: "hikvision", host: "", username: "", password: "", channel: 1, rtsp_url_custom: "" };
          await this.loadCameras();
        } catch (e) {
          this.error = e.message;
        } finally {
          this.loading = false;
        }
      },
      async openRealign(cam) {
        this.realignError = "";
        this.realign = null;
        try {
          const result = await apiJson(`/api/admin/cameras/${cam.id}/realign/preview`, { method: "POST" });
          this.realign = Object.assign(result, { cameraId: cam.id, cameraName: cam.name });
          if (result.transform_found) {
            this.$nextTick(() => renderRealignPreview(result.snapshot_url, result.slots));
          }
        } catch (e) {
          this.realignError = "ผิดพลาด: " + e.message;
        }
      },
      async confirmRealign() {
        if (!this.realign) return;
        this.realignLoading = true;
        try {
          await apiJson(`/api/admin/cameras/${this.realign.cameraId}/realign/confirm`, { method: "POST" });
          this.realign = null;
          await this.loadCameras();
        } catch (e) {
          this.realignError = "ยืนยันไม่สำเร็จ: " + e.message;
        } finally {
          this.realignLoading = false;
        }
      },
      cancelRealign() {
        this.realign = null;
        this.realignError = "";
      },
    };
  }

  async function renderRealignPreview(snapshotUrl, slots) {
    const container = document.getElementById("realign-stage-container");
    if (!container) return;
    const maxWidth = Math.min(900, container.closest(".card").clientWidth - 2);
    const img = new Image();
    const loaded = await new Promise((resolve) => {
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = snapshotUrl + `?t=${Date.now()}`;
    });
    if (!loaded) {
      container.innerHTML = '<p class="muted">โหลดภาพไม่สำเร็จ</p>';
      return;
    }
    const scale = Math.min(1, maxWidth / img.naturalWidth);
    const w = Math.round(img.naturalWidth * scale);
    const h = Math.round(img.naturalHeight * scale);

    container.innerHTML = "";
    const stage = new Konva.Stage({ container: "realign-stage-container", width: w, height: h });
    const bgLayer = new Konva.Layer();
    bgLayer.add(new Konva.Image({ image: img, width: w, height: h }));
    stage.add(bgLayer);
    const overlay = new Konva.Layer();
    stage.add(overlay);

    for (const slot of slots) {
      overlay.add(
        new Konva.Line({
          points: slot.old_polygon.flatMap(([x, y]) => [x * w, y * h]),
          closed: true,
          stroke: "#f97316",
          strokeWidth: 2,
          dash: [6, 4],
          listening: false,
        })
      );
      overlay.add(
        new Konva.Line({
          points: slot.new_polygon.flatMap(([x, y]) => [x * w, y * h]),
          closed: true,
          stroke: "#16a34a",
          strokeWidth: 2,
          listening: false,
        })
      );
    }
    overlay.draw();
  }
</script>
